<!-- @dsCard group="Role" height=500 width=960 -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>RoleCard</title>
<style>
html,body{margin:0;background:var(--night-900);}
body{padding:16px;font-family:var(--font-ui);color:var(--gray-100);}
.col{display:flex;flex-direction:column;gap:8px;max-width:360px;}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;}
.cap{font-size:14px;color:var(--gray-300);margin:0 0 4px;}
.cell{display:flex;flex-direction:column;gap:8px;align-items:center;}
</style></head>
<body>
<div id="root" class="mf-root"></div>
<script>
var M = window.Minifia, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'row',style:{gap:'24px'}},
 h('div',{className:'cell'},h('p',{className:'cap'},'뒷면 (모두 같음)'),h(M.RoleCard,{role:null})),
 h('div',{className:'cell'},h('p',{className:'cap'},'마피아'),h(M.RoleCard,{role:'mafia',face:'front',mates:['서연']})),
 h('div',{className:'cell'},h('p',{className:'cap'},'경찰'),h(M.RoleCard,{role:'police',face:'front'}))));
</script>
</body>
</html>
