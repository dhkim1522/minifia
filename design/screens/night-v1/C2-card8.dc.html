g width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/></svg></span></sc-if></span></sc-if><sc-if value="{{s.j_citizen}}" hint-placeholder-val="{{false}}"><span class="jc jc--sm"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="citizen" role="img"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg><sc-if value="{{s.chg}}" hint-placeholder-val="{{false}}"><span class="jc__chg" role="img" aria-label="말 바꿈"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/></svg></span></sc-if></span></sc-if><sc-if value="{{s.j_none}}" hint-placeholder-val="{{false}}"><span class="jc jc--back jc--sm" role="img" aria-label="밝히지 않음"></span></sc-if><sc-if value="{{s.me}}" hint-placeholder-val="{{false}}"><span class="sf__ring"></span></sc-if><sc-if value="{{s.host}}" hint-placeholder-val="{{false}}"><span class="sf__crown"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-label="방장" role="img"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/></svg></span></sc-if></div>
      </sc-for>
      <sc-for list="{{tags}}" as="t" hint-placeholder-count="8">
        <div class="{{t.cls}}" style="{{t.style}}">
          <span class="tg__n"><i style="{{t.dot}}"></i>{{t.name}}</span>
          <span class="{{t.cCls}}"><sc-if value="{{t.done}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></sc-if>{{t.claim}}<sc-if value="{{t.chg}}" hint-placeholder-val="{{false}}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/></svg></sc-if></span>
        </div>

      <sc-for list="{{emos}}" as="e" hint-placeholder-count="1">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":664}}'>
class Component extends DCLogic {
  renderVals() {
    const F = ["/_blob/3aa695b4c0db99eea9f6335a79c9a166", "/_blob/e6e038c578e0c85f8b8c147f830ac93f", "/_blob/52576e650f45690da60943f32d96eb06", "/_blob/970ae6ce6e86178f0300fd105909b763", "/_blob/c65cd6c77ba97e966113a9b5c097bccb", "/_blob/ce7ade166113b9ac82822228a2481802", "/_blob/0bc9e0edacd6459706b339d7541a4e3e", "/_blob/b8db2f4c3ab5ffcf6356c05c63ee28cd"];
    const C = ['#7a8fb8','#8e7ab8','#6fa59a','#b89a6f','#6f8fa8','#9aa86f','#b87a5c','#a9aebb'];
    const base = [{"name": "동현", "host": true, "me": true, "job": null, "claim": "", "none": false}, {"name": "가나다라마", "job": "mafia", "chg": true, "claim": "", "none": false}, {"name": "지호", "job": "citizen", "claim": "", "none": false}, {"name": "하늘", "job": "police", "fresh": true, "claim": "", "none": false}, {"name": "서연", "job": "doctor", "claim": "", "none": false}, {"name": "민준", "job": "citizen", "claim": "", "none": false}, {"name": "유나", "job": null, "claim": "", "none": false}, {"name": "봇파하", "job": "citizen", "chg": true, "claim": "", "none": false}];
    // 좌표 검사(이름표 14px 고정, 캐릭터·이웃 이름표·화면 끝 겹침 0) 결과. 장면 366×407
    const o = {"cx": 183, "W": 366, "rx": 132, "ry": 100, "cy": 210, "FW": 72, "k0": 0.8, "felt": [280, 108, 150]};
    const n = base.length, seats = [], tags = [], emos = [];
    base.forEach((b, i) => {
      const th = Math.PI / 2 + (i / n) * Math.PI * 2;
      const depth = (Math.sin(th) + 1) / 2;
      const s = o.k0 + (1 - o.k0) * depth;
      const FH = o.FW * 4 / 3;
      const x = o.cx + o.rx * Math.cos(th), y = o.cy + o.ry * Math.sin(th);
      const z = Math.round(depth * 10);
      seats.push({ fig: F[i], me: !!b.me, host: !!b.host, chg: !!b.chg, j_mafia: b.job === 'mafia', j_police: b.job === 'police', j_doctor: b.job === 'doctor', j_citizen: b.job === 'citizen', j_none: !b.job,
        style: 'left:' + (x - o.FW / 2).toFixed(1) + 'px;top:' + (y - FH).toFixed(1) + 'px;width:' + o.FW + 'px;height:' + FH.toFixed(1) + 'px;transform:scale(' + s.toFixed(3) + ');z-index:' + z });
      tags.push({ name: b.name, claim: b.claim, chg: !!b.chg, done: !!b.done, dot: 'background:' + C[i],
        cls: 'tg' + (b.me ? ' tg--me' : '') + (b.fresh ? ' tg--new' : ''),
        cCls: 'tg__c' + (b.none ? ' tg__c--none' : '') + (b.wait ? ' tg__c--wait' : '') + (b.done ? ' tg__c--done' : '') + (b.pop ? ' tg__c--pop' : ''),
        style: 'left:' + x.toFixed(1) + 'px;top:' + (y + 3).toFixed(1) + 'px;z-index:' + (z + 20) });
      if (b.emoji) emos.push({ style: 'left:' + (x - 16).toFixed(1) + 'px;top:' + Math.max(0, y - FH * s - 36).toFixed(1) + 'px' });
    });
    // 테이블 면: 가로는 좌석 반지름에 맞추고(최대 280), 세로는 ry 에 비례
    const [fw, fh, ft] = o.felt;
    const feltStyle = 'left:' + ((o.W - fw) / 2).toFixed(1) + 'px;width:' + fw + 'px;height:' + fh + 'px;top:' + ft + 'px';
    return { seats, tags, emos, feltStyle };
  }
}
</script>
