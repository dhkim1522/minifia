(function () {

  function motes(ctx, p, colors, n, spread, top) {

        var wh = cyl(car, 0.26, 0.26, 0.26, 16, M('#0a0a10'), w[0], 0.27, w[1]); wh.rotation.x = Math.PI / 2;
      });
      box(car, 2.2, 0.05, 0.25, M('#2b2f38'), 0, 0.22, 0.55); box(car, 2.2, 0.05, 0.25, M('#2b2f38'), 0, 0.22, -0.55);
      [-0.3, 0.3].forEach(function (lz) { add(car, new THREE.SphereGeometry(0.1, 10, 8), E(ctx, '#e6ebff', 0.6), 1.28, 0.6, lz, false); });
      box(car, 0.08, 0.3, 0.5, M('#a9aebb', { metalness: 0.6, roughness: 0.3 }), 1.27, 0.5, 0);
    }
    sedan(2.0, 9.0, 0); sedan(9.0, -3.2, Math.PI / 2); sedan(-6.0, 10.0, Math.PI);
    var rail = M('#0b1024');
    box(root, 13, 0.05, 0.05, rail, -0.5, 0.6, 6.9); box(root, 0.05, 0.05, 13, rail, 6.9, 0.6, -0.5);
    for (var r = -7; r <= 6; r++) { box(root, 0.04, 0.6, 0.04, rail, r, 0.3, 6.9); box(root, 0.04, 0.6, 0.04, rail, 6.9, 0.3, r); }
    motes(ctx, root, ['#cfd9ff', '#dde3f0'], 12, 16, 5);
    ctx.gather = [0, 0]; ctx.pawnR = 1.9;
  }

  // ---------- 콘셉트 목록 ----------
  var CONCEPTS = [
    { id: 'parlor', label: '달빛 응접실', view: 8.4, pan: 3.2, build: buildParlor, fog: [16, 40],
      text: 'v1.0 의 "커튼 너머 달빛 마을이 보이는 방"을 넓은 저택 응접실로 옮겼어요. 앞쪽 두 벽은 잘라 내 화면 밖까지 방이 이어져요. 창 두 개, 벽난로와 안락의자, 책장, 괘종시계, 그랜드 피아노, 샹들리에',
      gather: '가운데 크림 대리석 원탁과 원탁을 바라보는 의자 8개. 지목 때 의자 둘레로 모여요',
      v1: '실내 배경(결정 0032·0033), 크림 대리석 원탁(결정 0013), 남색 밤 색',
      ref: 'map-iso-3d-house(잘라 낸 실내), minifia_map1(보라 톤)',
      sw: ['#2b2f55', '#e0d8c4', '#4a2a44', '#5a3f2f', '#ffd59a'],
      // 실내: 바깥이 어두워질수록 샹들리에·벽등·스탠드·벽난로를 켠다. 바닥 밝기는 항상 플레이할 수 있게 유지
      tune: function (p) {
        return {
          hemi: Math.max(p.hemi * 0.85, 0.36 + p.on * 0.06),
          ground: p.on > 0.5 ? '#2a1e1a' : p.ground,
          sun: p.sun * 0.85,
          exp: Math.max(p.exp, 0.98),
          lk: 0.15 + p.on * 1.05,
          ek: Math.max(0.25, p.on),
          gk: 0.2 + p.on * 0.7,
          fogK: 1.6
        };
      } },
    { id: 'plaza', label: '달빛 시계탑 광장', view: 9.6, pan: 3.6, build: buildPlaza, fog: [17, 46],
      text: 'v1.0 의 남색·달빛·크림 대리석으로 만든 1930년대 마피아 도심 광장이에요. 뒤 모서리의 시계탑, 돔과 대리석 기둥의 중앙 은행, 호텔·식당·신문·이발소·양복점·전당포, 수배 전단, 노천 카페, 공중전화, 검은 세단, 전차 선로. 벽돌 건물마다 망사르드·박공·평지붕, 덧창과 창가 화분, 발코니, 비상계단, 옥상 물탱크를 달았어요',
      gather: '광장 가운데 크림 대리석 원판(v1.0 원탁을 바닥으로 옮김)',
      v1: '밤 남색·달빛·마을 실루엣 색(tokens), 크림 대리석, "어둡지만 경쾌한 밤", 금테·네온 안 씀',
      ref: 'minifia_map1(안개 광장 구도), map-iso-night-city(도시 블록)',
      sw: ['#0e1326', '#1e2847', '#2a3760', '#e0d8c4', '#dde3f0'],
      // 야외: 밤은 스산하되 광장 가운데(모이는 자리)와 걷는 길은 가로등 빛으로 읽히게 한다
      tune: function (p) {
        return {
          hemi: Math.max(p.hemi, 0.3 + p.on * 0.04),
          exp: Math.max(p.exp, 0.9),
          lk: p.on * 1.25,
          ek: Math.max(p.ek, p.on),
          gk: 0.1 + p.on * 0.75
        };
      } }
  ];

  var current = null, ctx = null, timeId = 'night', showPawns = true;
  function disposeTree(o) {
    o.traverse(function (n) {
      if (n.geometry) n.geometry.dispose();
      if (n.material) { (Array.isArray(n.material) ? n.material : [n.material]).forEach(function (m) { m.dispose(); }); }
    });
  }
  function applyTime() {
    var base = TIMES.filter(function (t) { return t.id === timeId; })[0];
    // 콘셉트마다 플레이할 수 있는 밝기를 지키도록 시간대 값을 보정한다
    var p = Object.assign({}, base, current.tune ? current.tune(base) : {});
    hemi.color.set(p.sky); hemi.groundColor.set(p.ground); hemi.intensity = p.hemi;
    sun.color.set(p.sunC); sun.intensity = p.sun; sunDir.set(p.pos[0], p.pos[1], p.pos[2]);
    scene.fog.color.set(p.fog); scene.fog.near = current.fog[0] * (p.fogK || 1); scene.fog.far = current.fog[1] * (p.fogK || 1);
    renderer.toneMappingExposure = p.exp;
    stage.style.background = p.bg;
    ctx.em.forEach(function (e) { e.m.emissiveIntensity = e.k * p.ek; });
    ctx.lamps.forEach(function (l) { l.cur = p.lk; l.l.intensity = l.k * p.lk; });
    ctx.glows.forEach(function (g) { g.s.material.opacity = g.k * p.gk; });
    ctx.windows.forEach(function (m) { m.map = townTexFor(p.id); m.needsUpdate = true; });
    ctx.pools.forEach(function (m) { m.color.set(p.pool[0]); m.opacity = p.pool[1]; });
    placeCamera();
    document.getElementById('badge').textContent = p.label + ' · ' + current.label;
  }
  function load(id) {
    if (ctx) { scene.remove(ctx.root); disposeTree(ctx.root); }
    current = CONCEPTS.filter(function (c) { return c.id === id; })[0];
    var root = new THREE.Group(); scene.add(root);
    ctx = { root: root, em: [], lamps: [], glows: [], tick: [], windows: [], pools: [] };
    current.build(ctx, root);
    pawnsAt(ctx, root, ctx.gather[0], ctx.gather[1], ctx.pawnR);
    ctx.pawns.visible = showPawns;
    VIEW = current.view; panLimit = current.pan; target.set(0, 0.6, 0); resize();
    applyTime();
    document.getElementById('dName').textContent = current.label;
    document.getElementById('dText').textContent = current.text;
    document.getElementById('dGather').textContent = current.gather;
    document.getElementById('dV1').textContent = current.v1;
    document.getElementById('dRef').textContent = current.ref;
    var sw = document.getElementById('dSw'); sw.innerHTML = '';
    current.sw.forEach(function (c) { var s = document.createElement('span'); s.style.background = c; s.title = c; sw.appendChild(s); });
  }

  function chipGroup(el, items, pressed, onPick) {
    items.forEach(function (it) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.id = el.id + '-' + it.id;
      if (it.num) { var n = document.createElement('span'); n.className = 'num'; n.textContent = it.num; b.appendChild(n); }
      b.appendChild(document.createTextNode(it.label));
      b.setAttribute('aria-pressed', it.id === pressed ? 'true' : 'false');
      b.addEventListener('click', function () {
        el.querySelectorAll('.chip').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
        onPick(it.id);
      });
      el.appendChild(b);
    });
  }
  chipGroup(document.getElementById('concepts'), CONCEPTS.map(function (c, i) { return { id: c.id, label: c.label, num: 'AB'[i] }; }), 'parlor', load);
  chipGroup(document.getElementById('times'), TIMES.map(function (t) { return { id: t.id, label: t.label }; }), 'night', function (id) { timeId = id; applyTime(); });
  var pawnBtn = document.getElementById('pawns');
  pawnBtn.addEventListener('click', function () { showPawns = !showPawns; pawnBtn.setAttribute('aria-pressed', showPawns ? 'true' : 'false'); if (ctx) ctx.pawns.visible = showPawns; });
  document.getElementById('rotL').addEventListener('click', function () { camYawTarget -= Math.PI / 2; });
  document.getElementById('rotR').addEventListener('click', function () { camYawTarget += Math.PI / 2; });

  var clock = new THREE.Clock(), t = 0;
  function frame() {
    var dt = Math.min(clock.getDelta(), 0.05); t += dt;
    if (Math.abs(camYawTarget - camYaw) > 0.001) camYaw += (camYawTarget - camYaw) * (reduceMotion ? 1 : Math.min(1, dt * 6));
    placeCamera();
    if (ctx && !reduceMotion) ctx.tick.forEach(function (f) { f(dt, t); });
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  placeCamera(); resize(); load('parlor');
  requestAnimationFrame(frame);
})();
</script>
