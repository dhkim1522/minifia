<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로비 분장실</title>
<script src="./support.js"></script>
<script src="./three.min.js"></script>
<script src="./character.js"></script>
<script src="./blockout-v2.js"></script>
<script src="./dressing.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060914}
.btn:focus-visible{outline:2px solid #e6e8ee;outline-offset:2px}
@keyframes mfRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #060914; color: #e6e8ee; font-family: 'Gowun Dodum', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; word-break: keep-all; user-select: none; -webkit-user-select: none">

<canvas id="drCanvas" aria-label="로비 백스테이지 분장실 블록아웃. 왼벽 조명 거울, 뒷벽 무대 문과 맵 포스터, 옷걸이 랙. 바닥을 누르면 지호가 걸어가고, 옷걸이 앞을 누르면 의상이 바뀌어요" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; display: block; cursor: pointer"></canvas>

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; pointer-events: none">
<sc-for list="{{ people }}" as="p" hint-placeholder-count="8">
<div id="drPlate{{ p.i }}" style="position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform">
<div style="position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: rgba(14, 19, 38, 0.8); white-space: nowrap; box-shadow: {{ p.ring }}">
<span style="width: 7px; height: 7px; border-radius: 999px; background: {{ p.color }}"></span>
<span style="font-size: 12px; line-height: 1.4; font-weight: 700; color: #f1f2f5">{{ p.name }}</span>
</div>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 120px; pointer-events: none; background: linear-gradient(to bottom, rgba(6, 9, 20, 0.85) 0px, rgba(6, 9, 20, 0.7) 70px, rgba(6, 9, 20, 0) 120px)"></div>
<header style="position: absolute; left: 0; top: 0; width: 390px; box-sizing: border-box; padding: 20px 16px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 20px; line-height: 1.3; font-weight: 700; color: #f1f2f5">로비 · 백스테이지 분장실</span>
<span style="font-size: 15px; line-height: 1.3; color: #a9aebb">바닥을 누르면 걸어가요</span>
</div>
<span style="font-size: 12px; line-height: 1.6; color: #a9aebb; font-variant-numeric: tabular-nums">{{ fpsText }}</span>
</header>

<sc-if value="{{ outfitOn }}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 0; right: 0; top: 96px; display: flex; justify-content: center; pointer-events: none; animation: mfRise 220ms ease-out both">
<span style="font-size: 16px; font-weight: 700; padding: 8px 16px; border-radius: 999px; background: rgba(21, 28, 54, 0.94); border: 1px solid #2a3760; color: #f1f2f5">{{ outfitText }}</span>
</div>
</sc-if>

<section style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 14px 16px 22px; background: rgba(21, 28, 54, 0.97); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; color: #a9aebb">방장이 고른 맵 · 문 위 포스터에 불이 켜져요</span>
<div role="radiogroup" aria-label="맵" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ maps }}" as="m" hint-placeholder-count="3">
<button type="button" class="btn" role="radio" aria-checked="{{ m.checked }}" onClick="{{ m.pick }}" style="min-height: 52px; padding: 0; border-radius: 14px; border: 1px solid {{ m.border }}; background: {{ m.bg }}; color: {{ m.fg }}; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{ m.label }}</button>
</sc-for>
</div>
<span style="font-size: 13px; color: #8a90a0">옷걸이 앞 바닥을 누르면 의상이 바뀌어요(앱에서는 꾸미기 창)</span>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var CONCEPT = 'dressing', PREFIX = 'dr', W = 390, H = 844, ME = 0;
var NAMES = [['지호', '#7a8fb8'], ['민준', '#6fa59a'], ['서연', '#b89a6f'], ['도윤', '#b87a5c'], ['하은', '#a9aebb'], ['태오', '#8f86b0'], ['수아', '#7f9f7a'], ['현우', '#a88f9a']];
var MAPS = [['bar', '재즈 바'], ['plaza', '광장'], ['random', '랜덤']];
var OUTFITS = [['coat', '기본'], ['noir', '누아르'], ['mafia', '마피아'], ['police', '경찰'], ['doctor', '의사'], ['detective', '탐정'], ['reporter', '기자'], ['elder', '어르신'], ['hood', '후드']];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fpsText: '', map: 'random', outfit: 0, outfitOn: false };
  }

  componentDidMount() {
    var self = this;
    this.alive = true;
    (function boot() {
      if (!self.alive) return;
      var canvas = document.getElementById(PREFIX + 'Canvas');
      if (!window.THREE || !window.MFChar || !window.MFB || !MFB.CONCEPTS[CONCEPT] || !canvas || !document.getElementById(PREFIX + 'Plate7')) { setTimeout(boot, 60); return; }
      self.start(canvas);
    })();
  }

  componentWillUnmount() {
    this.alive = false;
    cancelAnimationFrame(this.raf);
    clearTimeout(this.outfitTimer);
    if (this.io) this.io.disconnect();
    if (this.st) this.st.dispose();
  }

  start(canvas) {
    var self = this;
    canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); });
    var st = this.st = MFB.createStage(canvas, CONCEPT, { width: W, height: H, offsetY: 110 });
    st.setPhase('talk');
    if (st.ctx.setPoster) st.ctx.setPoster(this.state.map);
    // 바닥을 누르면 지호가 걸어간다. 옷걸이 앞이면 의상을 바꾼다
    var ray = new THREE.Raycaster(), floor = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
    canvas.addEventListener('click', function (e) {
      var r = canvas.getBoundingClientRect();
      ray.setFromCamera({ x: (e.clientX - r.left) / r.width * 2 - 1, y: -(e.clientY - r.top) / r.height * 2 + 1 }, st.camera);
      if (!ray.ray.intersectPlane(floor, hit)) return;
      if (hit.x > -1.7 && hit.x < 1.1 && hit.z < -3.0) { self.nextOutfit(); return; }
      st.walkTo(ME, Math.max(-4.2, Math.min(4.6, hit.x)), Math.max(-3.4, Math.min(4.6, hit.z)));
    });
    var plates = NAMES.map(function (n, i) { return document.getElementById(PREFIX + 'Plate' + i); });
    this.visible = true;
    if (window.IntersectionObserver) { this.io = new IntersectionObserver(function (es) { self.visible = es[0].isIntersecting; }); this.io.observe(canvas); }
    var last = performance.now(), acc = 0, frames = 0, fpsT = 0;
    function frame(now) {
      if (!self.alive) return;
      var dt = Math.min((now - last) / 1000, 0.1); last = now; acc += dt;
      if (self.visible && !document.hidden && acc >= 1 / 30) {
        st.frame(Math.min(acc, 0.05));
        st.people.forEach(function (c, i) {
          var el = plates[i]; if (!el) return;
          el.style.transform = 'translate(' + c.sx.toFixed(1) + 'px,' + c.sy.toFixed(1) + 'px)';
        });
        frames++; fpsT += acc; acc = 0;
        if (fpsT >= 1) {
          self.setState({ fpsText: Math.round(frames / fpsT) + ' FPS · 그리기 ' + st.renderer.info.render.calls });
          frames = 0; fpsT = 0;
        }
      }
      self.raf = requestAnimationFrame(frame);
    }
    this.raf = requestAnimationFrame(frame);
  }

  nextOutfit() {
    var self = this, n = (this.state.outfit + 1) % OUTFITS.length;
    if (this.st && window.MFChar && MFChar.applyOutfit) MFChar.applyOutfit(this.st.people[ME], OUTFITS[n][0]);
    clearTimeout(this.outfitTimer);
    this.outfitTimer = setTimeout(function () { if (self.alive) self.setState({ outfitOn: false }); }, 1500);
    this.setState({ outfit: n, outfitOn: true });
  }

  renderVals() {
    var self = this, s = this.state;
    return {
      fpsText: s.fpsText,
      outfitOn: s.outfitOn, outfitText: '지호 · ' + OUTFITS[s.outfit][1],
      people: NAMES.map(function (n, i) { return { i: i, name: n[0], color: n[1], ring: i === ME ? 'inset 0 0 0 1.5px #e6e8ee' : 'none' }; }),
      maps: MAPS.map(function (m) {
        var on = s.map === m[0];
        return { label: m[1], checked: on ? 'true' : 'false', bg: on ? '#e6e8ee' : '#1e2847', fg: on ? '#0e1326' : '#e6e8ee', border: on ? '#e6e8ee' : '#2a3760',
          pick: function () { if (self.st && self.st.ctx.setPoster) self.st.ctx.setPoster(m[0]); self.setState({ map: m[0] }); } };
      })
    };
  }
}
</script>
</body>
</html>
