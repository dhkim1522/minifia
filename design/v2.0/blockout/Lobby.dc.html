<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로비 분장실</title>
<script src="./support.js"></script>
<script src="./three.min.js"></script>
<script src="./character.js"></script>
<script src="./blockout.js"></script>
<script src="./dressing.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060914}
a{color:#a9aebb}a:hover{color:#e6e8ee}
.btn:focus-visible{outline:2px solid #e6e8ee;outline-offset:2px}
@keyframes mfPop{0%{transform:scale(0.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #060914; color: #e6e8ee; font-family: 'Gowun Dodum', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; word-break: keep-all; user-select: none; -webkit-user-select: none">

<canvas id="drCanvas" aria-label="로비 백스테이지 분장실 블록아웃. 왼벽 조명 거울, 뒷벽 무대 문과 맵 포스터, 옷걸이 랙" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; display: block"></canvas>

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; pointer-events: none">
<sc-for list="{{ people }}" as="p" hint-placeholder-count="8">
<div id="drPlate{{ p.i }}" style="position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform">
<div style="position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 3px">
<sc-if value="{{ p.hasBubble }}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; line-height: 1; padding: 5px 9px 6px; border-radius: 999px; background: #e6e8ee; color: #0e1326; font-weight: 700; white-space: nowrap; animation: mfPop 260ms ease-out">{{ p.bubble }}</span>
</sc-if>
<sc-if value="{{ p.hasBadge }}" hint-placeholder-val="{{ false }}">
<span style="min-width: 22px; text-align: center; font-size: 14px; line-height: 1; padding: 5px 8px 6px; border-radius: 999px; background: #f1f2f5; color: #0e1326; font-weight: 700; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 2px rgba(14, 19, 38, 0.7); animation: mfPop 260ms ease-out">{{ p.badge }}</span>
</sc-if>
<div style="display: flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: rgba(14, 19, 38, 0.8); white-space: nowrap">
<span style="width: 7px; height: 7px; border-radius: 999px; background: {{ p.color }}"></span>
<span style="font-size: 12px; line-height: 1.4; font-weight: 700; color: #f1f2f5">{{ p.name }}</span>
</div>
</div>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 120px; pointer-events: none; background: linear-gradient(to bottom, rgba(6, 9, 20, 0.85) 0px, rgba(6, 9, 20, 0.7) 70px, rgba(6, 9, 20, 0) 120px)"></div>
<header style="position: absolute; left: 0; top: 0; width: 390px; box-sizing: border-box; padding: 20px 16px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 20px; line-height: 1.3; font-weight: 700; color: #f1f2f5">① 지하 재즈 바</span>
<span style="font-size: 15px; line-height: 1.3; color: #a9aebb">{{ phaseTitle }}</span>
</div>
<span style="font-size: 12px; line-height: 1.6; color: #a9aebb; font-variant-numeric: tabular-nums">{{ fpsText }}</span>
</header>

<div role="status" aria-live="polite" style="position: absolute; left: 0; top: 88px; width: 390px; display: flex; justify-content: center; pointer-events: none; opacity: {{ toastOpacity }}; transition: opacity 220ms">
<span style="font-size: 17px; line-height: 1.3; font-weight: 700; padding: 8px 16px; border-radius: 999px; background: rgba(21, 28, 54, 0.94); border: 1px solid #2a3760; color: #f1f2f5">{{ toast }}</span>
</div>

<section style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 14px 16px 22px; background: rgba(21, 28, 54, 0.97); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 10px">
<div role="log" aria-label="채팅" style="height: 104px; box-sizing: border-box; padding: 8px 10px; border-radius: 12px; background: #0e1326; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; overflow: hidden">
<sc-for list="{{ chat }}" as="m" hint-placeholder-count="3">
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: {{ m.color }}">{{ m.text }}</p>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 13px; color: #a9aebb; white-space: nowrap">순간 알림</span>
<div role="group" aria-label="지목 순간 알림 방식" style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ notifies }}" as="n" hint-placeholder-count="2">
<button type="button" class="btn" onClick="{{ n.pick }}" aria-pressed="{{ n.pressed }}" style="min-height: 44px; padding: 0; border-radius: 12px; border: 1px solid {{ n.border }}; background: {{ n.bg }}; color: {{ n.fg }}; font-family: inherit; font-size: 14px; cursor: pointer">{{ n.label }}</button>
</sc-for>
</div>
</div>
<div role="group" aria-label="게임 단계" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ phases }}" as="ph" hint-placeholder-count="4">
<button type="button" class="btn" onClick="{{ ph.pick }}" aria-pressed="{{ ph.pressed }}" style="min-height: 48px; padding: 0; border-radius: 12px; border: 1px solid {{ ph.border }}; background: {{ ph.bg }}; color: {{ ph.fg }}; font-family: inherit; font-size: 15px; cursor: pointer">{{ ph.label }}</button>
</sc-for>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var CONCEPT = 'dressing', PREFIX = 'dr', W = 390, H = 844;
var PHASES = [{ id: 'talk', label: '로비' }];
var NAMES = [['지호', '#7a8fb8'], ['민준', '#6fa59a'], ['서연', '#b89a6f'], ['도윤', '#b87a5c'], ['하은', '#a9aebb'], ['태오', '#8f86b0'], ['수아', '#7f9f7a'], ['현우', '#a88f9a']];
// 지목 예시: i 번이 VOTES[i] 번을 가리킨다(blockout.js 와 같다). ORDER 순서로 1.2초마다 한 명씩 지목한다
var VOTES = [3, 3, 5, 0, 3, 3, 3, 5], ACCUSED = 3, ORDER = [1, 4, 0, 2, 5, 7, 6, 3];
var SYS = '#a9aebb', VOTE = '#e6e8ee';

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'vote', fpsText: '', notify: 'toast', counts: [0, 0, 0, 0, 0, 0, 0, 0], bubbles: {}, toast: '', toastOn: false, chat: [] };
  }

  componentDidMount() {
    var self = this;
    this.alive = true;
    (function boot() {
      if (!self.alive) return;
      var canvas = document.getElementById(PREFIX + 'Canvas');
      if (!window.THREE || !window.MFChar || !window.MFB || !MFB.CONCEPTS[CONCEPT] || !canvas || !document.getElementById(PREFIX + 'Plate7')) { setTimeout(boot, 60); return; }
      self.start(canvas);
    })();
  }

  componentWillUnmount() {
    this.alive = false;
    cancelAnimationFrame(this.raf);
    if (this.io) this.io.disconnect();
    if (this.st) this.st.dispose();
  }

  start(canvas) {
    var self = this;
    canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); });
    this.st = MFB.createStage(canvas, CONCEPT, { width: W, height: H, offsetY: 90 });
    this.pick(this.state.phase);
    var st = this.st, plates = NAMES.map(function (n, i) { return document.getElementById(PREFIX + 'Plate' + i); });
    this.visible = true;
    if (window.IntersectionObserver) { this.io = new IntersectionObserver(function (es) { self.visible = es[0].isIntersecting; }); this.io.observe(canvas); }
    var last = performance.now(), acc = 0, frames = 0, fpsT = 0;
    function frame(now) {
      if (!self.alive) return;
      var dt = Math.min((now - last) / 1000, 0.1); last = now; acc += dt;
      if (self.visible && !document.hidden && acc >= 1 / 30) {
        var step = Math.min(acc, 0.05);
        st.frame(step);
        self.tickVotes(step);
        st.people.forEach(function (c, i) {
          var el = plates[i]; if (!el) return;
          el.style.transform = 'translate(' + c.sx.toFixed(1) + 'px,' + c.sy.toFixed(1) + 'px)';
          el.style.opacity = c.root.visible ? '1' : '0';
        });
        frames++; fpsT += acc; acc = 0;
        if (fpsT >= 1) {
          self.setState({ fpsText: Math.round(frames / fpsT) + ' FPS · 그리기 ' + st.renderer.info.render.calls });
          frames = 0; fpsT = 0;
        }
      }
      self.raf = requestAnimationFrame(frame);
    }
    this.raf = requestAnimationFrame(frame);
  }

  // 지목 단계: 한 명씩 지목하고, 머리 위 표 수·순간 알림·채팅을 갱신한다
  tickVotes(dt) {
    if (this.state.phase !== 'vote') return;
    this.clock += dt;
    var s = this.state, changed = null;
    while (this.next < ORDER.length && this.clock >= 0.9 + this.next * 1.2) {
      var i = ORDER[this.next++], t = VOTES[i];
      this.st.castVote(i);
      var counts = (changed || s).counts.slice(); counts[t]++;
      if (t === ACCUSED && counts[t] === 3) this.st.emote(t, 'deny');
      var chat = (changed || s).chat.concat([{ text: NAMES[i][0] + ' 님이 ' + NAMES[t][0] + ' 님을 지목했어요', color: VOTE }]);
      var bubbles = Object.assign({}, (changed || s).bubbles);
      changed = { counts: counts, chat: chat, bubbles: bubbles };
      if (s.notify === 'toast') { changed.toast = NAMES[i][0] + ' → ' + NAMES[t][0]; changed.toastOn = true; this.toastUntil = this.clock + 1.5; }
      else { bubbles[i] = NAMES[t][0] + '!'; this.bubbleUntil[i] = this.clock + 1.8; }
    }
    var b = (changed || s).bubbles, self = this;
    Object.keys(b).forEach(function (k) {
      if (self.clock > self.bubbleUntil[k]) { if (!changed) changed = {}; changed.bubbles = Object.assign({}, b); delete changed.bubbles[k]; b = changed.bubbles; }
    });
    if (s.toastOn && !(changed && changed.toastOn) && this.clock > this.toastUntil) { if (!changed) changed = {}; changed.toastOn = false; }
    if (changed) this.setState(changed);
  }

  pick(id) {
    var def = MFB.CONCEPTS[CONCEPT], final = [0, 0, 0, 0, 0, 0, 0, 0];
    VOTES.forEach(function (t) { final[t]++; });
    var chat = [{ text: '[' + PHASES.filter(function (p) { return p.id === id; })[0].label + '] ' + def.text[id], color: SYS }];
    if (id === 'trial') chat.push({ text: NAMES[ACCUSED][0] + ' 님이 ' + final[ACCUSED] + '표로 최후 변론에 섰어요', color: VOTE });
    this.clock = 0; this.next = 0; this.toastUntil = 0; this.bubbleUntil = {};
    this.setState({ phase: id, counts: id === 'trial' ? final : [0, 0, 0, 0, 0, 0, 0, 0], bubbles: {}, toastOn: false, chat: chat });
    if (this.st) this.st.setPhase(id);
  }

  renderVals() {
    var self = this, s = this.state, cur = s.phase;
    function btn(label, on, pick) { return { label: label, pressed: on ? 'true' : 'false', bg: on ? '#e6e8ee' : '#1e2847', fg: on ? '#0e1326' : '#e6e8ee', border: on ? '#e6e8ee' : '#2a3760', pick: pick }; }
    return {
      people: NAMES.map(function (n, i) {
        var c = s.counts[i], bub = s.bubbles[i];
        return { i: i, name: n[0], color: n[1], hasBadge: c > 0, badge: c + '표', hasBubble: !!bub, bubble: bub || '' };
      }),
      phases: PHASES.map(function (p) { return btn(p.label, p.id === cur, function () { self.pick(p.id); }); }),
      notifies: [btn('화면 위', s.notify === 'toast', function () { self.setState({ notify: 'toast' }); if (cur === 'vote') self.pick('vote'); }),
        btn('말풍선', s.notify === 'bubble', function () { self.setState({ notify: 'bubble' }); if (cur === 'vote') self.pick('vote'); })],
      phaseTitle: PHASES.filter(function (p) { return p.id === cur; })[0].label,
      toast: s.toast,
      toastOpacity: s.toastOn ? 1 : 0,
      chat: s.chat.slice(-5),
      fpsText: s.fpsText
    };
  }
}
</script>
</body>
</html>
