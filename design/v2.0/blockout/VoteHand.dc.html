<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>득표 표시 ① 숫자</title>
<script src="./support.js"></script>
<script src="./three.min.js"></script>
<script src="./character.js"></script>
<script src="./blockout.js"></script>
<script src="./bar.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;family=Gowun+Batang:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060914}
a{color:#a9aebb}a:hover{color:#e6e8ee}
.btn:focus-visible{outline:2px solid #e6e8ee;outline-offset:2px}
@keyframes mfPop{0%{transform:scale(0.4);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
@keyframes mfPulse{0%,100%{transform:scale(1.18)}50%{transform:scale(1.34)}}
@keyframes mfStamp{0%{transform:rotate(-10deg) scale(2.2);opacity:0}70%{transform:rotate(-10deg) scale(0.92);opacity:1}100%{transform:rotate(-10deg) scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #060914; color: #e6e8ee; font-family: 'Gowun Dodum', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; word-break: keep-all; user-select: none; -webkit-user-select: none">

<canvas id="vhCanvas" aria-label="지하 재즈 바의 지목 장면. 지목받은 사람 머리 위에 표식이 쌓여요" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; display: block"></canvas>

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; pointer-events: none">
<sc-for list="{{ people }}" as="p" hint-placeholder-count="8">
<div id="vhPlate{{ p.i }}" style="position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; z-index: {{ p.z }}">
<div style="position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 4px">

<sc-if value="{{ p.isSure }}" hint-placeholder-val="{{ false }}">
<span style="font-family: 'Gowun Batang', serif; font-size: 15px; font-weight: 700; line-height: 1; letter-spacing: 0.12em; white-space: nowrap; padding: 4px 8px 5px 10px; border: 2px solid #c9a46a; border-radius: 4px; color: #e8d3a8; background: rgba(14, 19, 38, 0.86); animation: mfStamp 420ms ease-out both">유력</span>
</sc-if>

<sc-if value="{{ p.hasMark }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: center; transform-origin: 50% 100%; animation: {{ p.anim }}; filter: {{ p.glow }}">

<sc-if value="{{ isNumber }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: baseline; justify-content: center; gap: 2px; min-width: 34px; box-sizing: border-box; padding: 4px 10px 6px; border-radius: 12px; background: rgba(14, 19, 38, 0.92); border: 2px solid #c9a46a; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); white-space: nowrap; animation: mfPop 260ms ease-out both">
<span style="font-family: 'Gowun Batang', serif; font-size: 22px; font-weight: 700; line-height: 1; color: #f1e6cf; font-variant-numeric: tabular-nums">{{ p.count }}</span>
<span style="font-size: 12px; font-weight: 700; line-height: 1; color: #c9a46a">표</span>
</div>
</sc-if>

<sc-if value="{{ isHand }}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat({{ p.cols }}, minmax(0, 1fr)); gap: 1px; padding: 3px 4px; border-radius: 10px; background: rgba(14, 19, 38, 0.72)">
<sc-for list="{{ p.items }}" as="h" hint-placeholder-count="2">
<svg width="20" height="27" viewBox="0 0 20 27" style="display: block; animation: mfPop 260ms ease-out both"><rect x="5" y="10" width="5" height="15.5" rx="2.5" fill="#efe3c8" stroke="#2b2118" stroke-width="1.4"></rect><rect x="5.9" y="21.6" width="3.2" height="2.8" rx="1.2" fill="#d9c7a4"></rect><rect x="3" y="1.5" width="15.5" height="11.5" rx="3.6" fill="#efe3c8" stroke="#2b2118" stroke-width="1.4"></rect><path d="M10.6 2.6 v5.2 M14.2 2.6 v5.2" stroke="#8f7048" stroke-width="1.2" stroke-linecap="round"></path><rect x="0.9" y="4.6" width="5.2" height="7.4" rx="2.6" fill="#efe3c8" stroke="#2b2118" stroke-width="1.4"></rect></svg>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ isMedal }}" hint-placeholder-val="{{ false }}">
<svg width="40" height="44" viewBox="0 0 40 44" style="display: block; animation: mfPop 260ms ease-out both"><path d="M13 0 L20 10 L27 0 Z" fill="#3a3f55"></path><circle cx="20" cy="25" r="17" fill="#6b5236"></circle><circle cx="20" cy="25" r="15" fill="#a98559"></circle><circle cx="20" cy="25" r="11.5" fill="#c9a46a" stroke="#8f7048" stroke-width="1"></circle><text x="20" y="31" text-anchor="middle" font-family="'Gowun Batang', serif" font-weight="700" font-size="17" fill="#2b2118">{{ p.count }}</text></svg>
</sc-if>

<sc-if value="{{ isBallot }}" hint-placeholder-val="{{ false }}">
<div style="position: relative; width: 40px; height: {{ p.stackH }}px">
<sc-for list="{{ p.items }}" as="b" hint-placeholder-count="2">
<div style="position: absolute; left: 4px; top: {{ b.top }}px; width: 32px; height: 18px; box-sizing: border-box; border-radius: 2px; background: #efe6d2; border: 1px solid #8f7048; box-shadow: 0 1px 2px rgba(0,0,0,0.5); transform: rotate({{ b.rot }}deg); animation: mfPop 260ms ease-out both"></div>
</sc-for>
<span style="position: absolute; left: 0; right: 0; bottom: 3px; text-align: center; font-family: 'Gowun Batang', serif; font-size: 13px; font-weight: 700; line-height: 1; color: #2b2118">{{ p.count }}</span>
</div>
</sc-if>

</div>
</sc-if>

<div style="display: flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: rgba(14, 19, 38, 0.8); white-space: nowrap">
<span style="width: 7px; height: 7px; border-radius: 999px; background: {{ p.color }}"></span>
<span style="font-size: 12px; line-height: 1.4; font-weight: 700; color: #f1f2f5">{{ p.name }}</span>
</div>
</div>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 120px; pointer-events: none; background: linear-gradient(to bottom, rgba(6, 9, 20, 0.85) 0px, rgba(6, 9, 20, 0.7) 70px, rgba(6, 9, 20, 0) 120px)"></div>
<header style="position: absolute; left: 0; top: 0; width: 390px; box-sizing: border-box; padding: 20px 16px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 20px; line-height: 1.3; font-weight: 700; color: #f1f2f5">득표 표시 ① 숫자</span>
<span style="font-size: 15px; line-height: 1.3; color: #a9aebb">지목 · 지하 재즈 바</span>
</div>
<span style="font-size: 12px; line-height: 1.6; color: #a9aebb; font-variant-numeric: tabular-nums">{{ fpsText }}</span>
</header>

<section style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 14px 16px 22px; background: rgba(21, 28, 54, 0.97); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 10px">
<div role="log" aria-label="채팅" style="height: 124px; box-sizing: border-box; padding: 8px 10px; border-radius: 12px; background: #0e1326; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; overflow: hidden">
<sc-for list="{{ chat }}" as="m" hint-placeholder-count="3">
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: {{ m.color }}">{{ m.text }}</p>
</sc-for>
</div>
<button type="button" class="btn" onClick="{{ replay }}" style="min-height: 48px; border-radius: 12px; border: 1px solid #2a3760; background: #1e2847; color: #e6e8ee; font-family: inherit; font-size: 15px; cursor: pointer">지목 다시 보기</button>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var STYLE = 'number', PREFIX = 'vh', W = 390, H = 844;
var NAMES = [['지호', '#7a8fb8'], ['민준', '#6fa59a'], ['서연', '#b89a6f'], ['도윤', '#b87a5c'], ['하은', '#a9aebb'], ['태오', '#8f86b0'], ['수아', '#7f9f7a'], ['현우', '#a88f9a']];
// i 번이 VOTES[i] 번을 지목한다. 태오가 먼저 앞서다가 도윤이 따라잡아 과반(5표)이 되는 순서
var VOTES = [3, 3, 5, 0, 3, 3, 3, 5], ORDER = [2, 7, 3, 1, 4, 0, 5, 6], MAJORITY = 5;
var SYS = '#a9aebb', VOTE = '#e6e8ee', HOT = '#e8d3a8';

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { counts: [0, 0, 0, 0, 0, 0, 0, 0], leader: -1, sure: -1, chat: [], fpsText: '' };
  }

  componentDidMount() {
    var self = this;
    this.alive = true;
    (function boot() {
      if (!self.alive) return;
      var canvas = document.getElementById(PREFIX + 'Canvas');
      if (!window.THREE || !window.MFChar || !window.MFB || !MFB.CONCEPTS.bar || !canvas || !document.getElementById(PREFIX + 'Plate7')) { setTimeout(boot, 60); return; }
      self.start(canvas);
    })();
  }

  componentWillUnmount() {
    this.alive = false;
    cancelAnimationFrame(this.raf);
    if (this.io) this.io.disconnect();
    if (this.st) this.st.dispose();
  }

  start(canvas) {
    var self = this;
    canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); });
    var st = this.st = MFB.createStage(canvas, 'bar', { width: W, height: H, offsetY: 110 });
    this.replay();
    var plates = NAMES.map(function (n, i) { return document.getElementById(PREFIX + 'Plate' + i); });
    this.visible = true;
    if (window.IntersectionObserver) { this.io = new IntersectionObserver(function (es) { self.visible = es[0].isIntersecting; }); this.io.observe(canvas); }
    var last = performance.now(), acc = 0, frames = 0, fpsT = 0;
    function frame(now) {
      if (!self.alive) return;
      var dt = Math.min((now - last) / 1000, 0.1); last = now; acc += dt;
      if (self.visible && !document.hidden && acc >= 1 / 30) {
        var step = Math.min(acc, 0.05);
        st.frame(step);
        self.tickVotes(step);
        st.people.forEach(function (c, i) {
          var el = plates[i]; if (!el) return;
          el.style.transform = 'translate(' + c.sx.toFixed(1) + 'px,' + c.sy.toFixed(1) + 'px)';
        });
        frames++; fpsT += acc; acc = 0;
        if (fpsT >= 1) { self.setState({ fpsText: Math.round(frames / fpsT) + ' FPS · 그리기 ' + st.renderer.info.render.calls }); frames = 0; fpsT = 0; }
      }
      self.raf = requestAnimationFrame(frame);
    }
    this.raf = requestAnimationFrame(frame);
  }

  replay() {
    this.clock = 0; this.next = 0;
    this.setState({ counts: [0, 0, 0, 0, 0, 0, 0, 0], leader: -1, sure: -1, chat: [{ text: '[지목] 모두 무대 둘레에 서서 차례로 지목해요.', color: SYS }] });
    if (this.st) { this.st.setPhase('vote'); this.st.setTension(0, -1); }
  }

  // 한 명씩 지목하고, 선두·과반에 따라 표식 효과와 무대 연출을 바꾼다
  tickVotes(dt) {
    this.clock += dt;
    if (this.next >= ORDER.length || this.clock < 1.0 + this.next * 1.4) return;
    var s = this.state, i = ORDER[this.next++], t = VOTES[i];
    this.st.castVote(i);
    var counts = s.counts.slice(); counts[t]++;
    var chat = s.chat.concat([{ text: NAMES[i][0] + ' 님이 ' + NAMES[t][0] + ' 님을 지목했어요', color: VOTE }]);
    var max = Math.max.apply(null, counts), tops = counts.filter(function (c) { return c === max; }).length;
    var leader = tops === 1 ? counts.indexOf(max) : -1, sure = max >= MAJORITY ? leader : -1;
    if (leader >= 0 && leader !== s.leader && sure < 0) chat.push({ text: '지금 ' + NAMES[leader][0] + ' 님이 가장 많이 지목받았어요', color: HOT });
    if (sure >= 0 && s.sure < 0) chat.push({ text: NAMES[sure][0] + ' 님이 과반 표를 받았어요', color: HOT });
    if (leader >= 0 && leader !== s.leader) this.st.emote(leader, 'deny');
    this.st.setTension(sure >= 0 ? 2 : leader >= 0 ? 1 : 0, leader);
    this.setState({ counts: counts, leader: leader, sure: sure, chat: chat });
  }

  renderVals() {
    var s = this.state, self = this;
    return {
      isNumber: STYLE === 'number', isHand: STYLE === 'hand', isMedal: STYLE === 'medal', isBallot: STYLE === 'ballot',
      people: NAMES.map(function (n, i) {
        var c = s.counts[i], lead = s.leader === i, items = [];
        for (var k = 0; k < c; k++) items.push({ top: (c - 1 - k) * 4, rot: [-7, 5, -3, 8, -6, 3, -9, 6][k] });
        return {
          i: i, name: n[0], color: n[1], count: c, hasMark: c > 0, isSure: s.sure === i,
          items: items, cols: Math.min(c, 4), stackH: 22 + Math.max(0, c - 1) * 4,
          anim: lead ? 'mfPulse 1.1s ease-in-out infinite' : 'none',
          glow: lead ? 'drop-shadow(0 0 6px rgba(255, 224, 176, 0.75))' : 'none',
          z: lead ? 20 : c > 0 ? 10 : 1
        };
      }),
      chat: s.chat.slice(-6),
      replay: function () { self.replay(); },
      fpsText: s.fpsText
    };
  }
}
</script>
</body>
</html>
