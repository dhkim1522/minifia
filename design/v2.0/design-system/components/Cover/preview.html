<!-- @dsCard height=288 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@700&display=swap">
<div id="cover" style="position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--night-900);">
<style>
  #cover .slab { fill: var(--night-700); }
  #cover .brass { fill: var(--brass-400); rx: var(--radius-badge); }
  #cover .cream { fill: var(--cream-100); rx: var(--radius-stamp); }
  #cover .crim { fill: var(--crimson-500); rx: var(--radius-stamp); }
  #cover .edge { fill: var(--night-600); rx: var(--radius-stamp); }
  #cover .glyph { fill: var(--brass-400); font-family: var(--font-serif); font-weight: 700; font-size: 340px; }
  #cover .name { position: absolute; left: 40px; bottom: 40px; width: 420px; margin: 0; display: flex; flex-direction: column; gap: 12px; }
  #cover .name b { font-family: var(--font-ui); font-size: 96px; line-height: 0.95; font-weight: 700; color: var(--gray-50); }
  #cover .name span { font-family: var(--font-ui); font-size: 14px; line-height: 1.4; color: var(--gray-300); }
</style>
<!-- blocks: night-700 slab 288×288, brass-400 152×120 (radius-badge), cream-100 72×104, crimson-500 64×48, night-600 64×40 (radius-stamp)
     arrangement: one tall slab bleeding top and bottom from x=480, satellites stacked to its right on a 16px gap
     pattern row: a distinctive numerals face → one oversized Gowun Batang "5", the vote-badge numeral, clipped by the slab
     steps and radii: space-md 16 gaps, space-lg 24 inset, radius-badge 12, radius-stamp 4 -->
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true" style="position: absolute; inset: 0;">
  <defs><clipPath id="slabClip"><rect x="480" y="0" width="288" height="288"></rect></clipPath></defs>
  <rect class="slab" x="480" y="0" width="288" height="288"></rect>
  <text class="glyph" x="520" y="318" clip-path="url(#slabClip)">5</text>
  <rect class="brass" x="784" y="24" width="152" height="120"></rect>
  <rect class="cream" x="784" y="160" width="72" height="104"></rect>
  <rect class="crim" x="872" y="160" width="64" height="48"></rect>
  <rect class="edge" x="872" y="224" width="64" height="40"></rect>
</svg>
<p class="name"><b>minifia<br>v2.0</b><span>같은 공간의 스산한 밤</span></p>
</div>
