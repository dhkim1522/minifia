<style>

    var ac = mesh(new THREE.BoxGeometry(0.5, 0.35, 0.5), mat('#55587a')); ac.position.set(w * 0.2, h + 0.3, -dpt * 0.15); g.add(ac);
    var fan = mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.04, 16), glowMat('#7fe6e0', 0.4)); fan.position.set(w * 0.2, h + 0.49, -dpt * 0.15); g.add(fan);

  }
  // 왼쪽 뒤: 길쭉한 2층 건물

    if (ringT < 1) { ringT += dt * 1.6; ring.material.opacity = Math.max(0, 0.8 * (1 - ringT)); ring.scale.setScalar(1 + ringT * 0.4); }
    if (!reduceMotion) water.material.emissiveIntensity = (mode === 'citizen' ? 0.1 : 0.45) + Math.sin(elapsed * 2) * 0.08;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  resize();
  setMode('day');
  setTimeout(function () { playEmote(chars[3], 'throat'); chars[1].typingUntil = 4; }, 600);
  requestAnimationFrame(frame);
})();
