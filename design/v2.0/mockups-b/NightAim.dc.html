<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>마피아 밤 선택 효과</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/minifiav2/tokens.css">
<link rel="stylesheet" href="ds/minifiav2/components/bundle.css">
<script src="ds/minifiav2/components/bundle.js"></script>
<script src="./three.min.js"></script>
<script src="./character.js"></script>
<script src="./blockout.js"></script>
<script src="./bar.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0e1326}
.na-btn:focus-visible,.na-tag:focus-visible{outline:2px solid #e6e8ee;outline-offset:2px}
.na-tag{position:relative;display:block;padding:0;border:0;background:none;cursor:pointer;border-radius:12px;-webkit-tap-highlight-color:transparent}
.na-tag::after{content:"";position:absolute;inset:-4px -6px;border-radius:12px;border:2px solid transparent;pointer-events:none;transition:border-color .15s,box-shadow .15s}
.na-tag.is-cand::after{border-color:rgba(224,52,75,.35);border-style:dashed}
.na-tag.is-preview::after{border-color:#e0344b;border-style:solid;box-shadow:0 0 12px rgba(224,52,75,.55)}
.na-tag.is-picked::after{border-color:#c8102e;border-style:solid;border-width:3px;box-shadow:0 0 18px rgba(200,16,46,.85);animation:naBeat 1.1s ease-in-out infinite}
.na-mark{position:absolute;left:50%;top:-30px;width:26px;height:26px;margin-left:-13px;pointer-events:none}
@keyframes naBeat{0%,100%{box-shadow:0 0 10px rgba(200,16,46,.6)}50%{box-shadow:0 0 22px rgba(200,16,46,1)}}
@keyframes naLock{from{transform:translate(-50%,-50%) scale(2.2) rotate(-60deg);opacity:0}to{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}}
@keyframes naSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--night-950); color: var(--gray-100); font-family: var(--font-ui); word-break: keep-all; user-select: none">

<canvas id="naCanvas" aria-label="밤의 재즈 바, 마피아가 대상을 고르는 장면" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; display: block"></canvas>

<sc-if value="{{ isReticle }}" hint-placeholder-val="{{ false }}">
<div id="naReticle" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 20; will-change: transform">
<sc-if value="{{ hasPick }}" hint-placeholder-val="{{ true }}">
<div key="{{ pickKey }}" style="position: absolute; left: 0; top: 0; width: 92px; height: 92px; animation: naLock 420ms cubic-bezier(.2,.8,.2,1) both">
<svg viewBox="0 0 100 100" width="92" height="92" style="animation: naSpin 6s linear infinite">
<circle cx="50" cy="50" r="40" fill="none" stroke="#e0344b" stroke-width="3" stroke-dasharray="18 8"/>
<circle cx="50" cy="50" r="5" fill="#e0344b"/>
<path d="M50 2v18M50 80v18M2 50h18M80 50h18" stroke="#ff5a6e" stroke-width="4" stroke-linecap="round"/>
</svg>
</div>
</sc-if>
</div>
</sc-if>

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; pointer-events: none; z-index: 30">
<sc-for list="{{ people }}" as="p" hint-placeholder-count="8">
<div id="naPlate{{ p.i }}" style="position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform">
<div style="position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: {{ p.pe }}">
<button type="button" class="na-tag {{ p.cls }}" aria-label="{{ p.label }}" aria-pressed="{{ p.pressed }}" disabled="{{ p.disabled }}" onPointerDown="{{ p.down }}" onPointerUp="{{ p.up }}" onPointerLeave="{{ p.up }}" onClick="{{ p.pick }}">
<sc-if value="{{ p.showMark }}" hint-placeholder-val="{{ false }}">
<svg class="na-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 9.2L12 22l-2.2-10.8z" fill="#e0344b"/><path d="M7 12h10" stroke="#e0344b" stroke-width="2.4" stroke-linecap="round"/></svg>
</sc-if>
<x-import component-from-global-scope="MinifiaV2.HeadStack" name="{{ p.name }}" color="{{ p.color }}" role="{{ p.role }}"></x-import>
</button>
</div>
</div>
</sc-for>
</div>

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 120px; pointer-events: none; z-index: 35; background: linear-gradient(to bottom, rgba(14, 19, 38, 0.88) 0px, rgba(14, 19, 38, 0.6) 70px, rgba(14, 19, 38, 0) 120px)"></div>
<div style="position: absolute; left: 0; top: 0; width: 390px; box-sizing: border-box; padding: 18px 16px 0; z-index: 40">
<x-import component-from-global-scope="MinifiaV2.PhaseHeader" title="밤" hint="{{ hint }}" show-hint="true" time="24" total="30"></x-import>
</div>

<section style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 14px 16px 22px; background: rgba(21, 28, 54, 0.97); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 10px; z-index: 50">
<div role="group" aria-label="시안 조절: 선택 효과" style="display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 12px; border: 1px dashed #3a4778">
<span style="font-size: 12px; color: #a9aebb; padding: 0 4px">시안</span>
<sc-for list="{{ styles }}" as="o" hint-placeholder-count="3">
<button type="button" class="na-btn" onClick="{{ o.pick }}" aria-pressed="{{ o.pressed }}" style="flex: 1; min-height: 40px; border-radius: 8px; border: 0; background: {{ o.bg }}; color: {{ o.fg }}; font-family: inherit; font-size: 14px; cursor: pointer">{{ o.label }}</button>
</sc-for>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #a9aebb">{{ caption }}</p>
<button type="button" class="na-btn" onClick="{{ reset }}" style="min-height: 44px; border-radius: 10px; border: 1px solid #2a3760; background: #1e2847; color: #e6e8ee; font-family: inherit; font-size: 15px; cursor: pointer">처음부터</button>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var W = 390, H = 844;
var NAMES = [['지호', '#7a8fb8'], ['민준', '#6fa59a'], ['서연', '#b89a6f'], ['도윤', '#b87a5c'], ['하은', '#a9aebb'], ['태오', '#8f86b0'], ['수아', '#7f9f7a'], ['현우', '#a88f9a']];
// 나는 6번 수아(마피아), 동료는 3번 도윤. 동료는 4번 하은을 골라 두었다(연한 고리)
var ME = 6, ALLY = 3, ALLY_PICK = 4;
var CRIMSON = '#c8102e', ALLY_RED = '#e0344b';
var STYLES = [
  ['outline', '몸 테두리', '추천. 누르고 있으면 미리 보기로 이름표가 붉어지고, 떼면 그 사람 몸에 붉은 윤곽이 생기며 발밑 고리가 크게 조였다가 맥박처럼 뜁니다. 내 캐릭터가 그쪽으로 걸어가요.'],
  ['reticle', '조준선', '고른 사람 몸 위에 붉은 조준선이 크게 돌며 조여 와 멈춥니다. 이름표는 붉은 테두리. 가장 "노린다" 느낌이지만 게임 같은 인상이 강해요.'],
  ['spot', '붉은 조명', '고른 사람 머리 위에 붉은 빛이 켜지고 나머지는 어두워집니다. 분위기는 가장 좋지만 작은 화면에선 누구인지 덜 또렷해요.']
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { style: 'outline', pick: -1, preview: -1, pickKey: 0 };
  }

  componentDidMount() {
    var self = this;
    this.alive = true;
    (function boot() {
      if (!self.alive) return;
      var canvas = document.getElementById('naCanvas');
      if (!window.THREE || !window.MFChar || !window.MFB || !MFB.CONCEPTS.bar || !canvas || !document.getElementById('naPlate7')) { setTimeout(boot, 60); return; }
      self.start(canvas);
    })();
  }

  componentWillUnmount() {
    this.alive = false;
    cancelAnimationFrame(this.raf);
    if (this.io) this.io.disconnect();
    if (this.st) this.st.dispose();
  }

  start(canvas) {
    var self = this;
    canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); });
    var st = this.st = MFB.createStage(canvas, 'bar', { width: W, height: H, offsetY: 110 });
    st.setPhase('night', { view: 'mafia', me: ME });
    st.ring('ally', ALLY_PICK, ALLY_RED, true);
    // 조이는 고리(고를 때 크게 나타났다가 발밑 크기로 줄어든다)
    var lock = this.lock = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.05, 8, 48), new THREE.MeshBasicMaterial({ color: CRIMSON, transparent: true, opacity: 0.95 }));
    lock.rotation.x = Math.PI / 2; lock.visible = false; st.ctx.root.add(lock);
    // 붉은 조명안: 머리 위 붉은 빛
    var red = this.red = new THREE.PointLight(CRIMSON, 0, 5, 2); st.scene.add(red);
    this.outlines = {};
    var plates = NAMES.map(function (n, i) { return document.getElementById('naPlate' + i); });
    this.visible = true;
    if (window.IntersectionObserver) { this.io = new IntersectionObserver(function (es) { self.visible = es[0].isIntersecting; }); this.io.observe(canvas); }
    var last = performance.now(), acc = 0, tt = 0;
    function frame(now) {
      if (!self.alive) return;
      var dt = Math.min((now - last) / 1000, 0.1); last = now; acc += dt; tt += dt;
      if (self.visible && !document.hidden && acc >= 1 / 30) {
        var s = self.state, p = s.pick;
        if (p >= 0) {
          var c = st.people[p];
          var age = (now - self.pickAt) / 1000, k = Math.min(1, age / 0.42), e = 1 - Math.pow(1 - k, 3);
          var sc = (2.4 - 1.4 * e) * (k >= 1 ? 1 + Math.sin(tt * 5) * 0.07 : 1);
          lock.position.set(c.pos.x, (c.y || 0) + 0.05, c.pos.z); lock.scale.setScalar(sc);
          lock.visible = s.style !== 'spot';
          red.position.set(c.pos.x, 2.6, c.pos.z);
          red.intensity = s.style === 'spot' ? 2.6 + Math.sin(tt * 3) * 0.4 : 0;
          var ret = document.getElementById('naReticle');
          if (ret) ret.style.transform = 'translate(' + c.sx.toFixed(1) + 'px,' + (c.sy + 46).toFixed(1) + 'px)';
        } else { lock.visible = false; red.intensity = 0; }
        st.frame(Math.min(acc, 0.05));
        st.people.forEach(function (c, i) {
          var el = plates[i]; if (!el) return;
          el.style.transform = 'translate(' + c.sx.toFixed(1) + 'px,' + c.sy.toFixed(1) + 'px)';
        });
        acc = 0;
      }
      self.raf = requestAnimationFrame(frame);
    }
    this.raf = requestAnimationFrame(frame);
  }

  // 몸 윤곽: 각 부품 뒤에 조금 큰 붉은 뒷면 껍질을 붙인다
  outline(i, on) {
    var st = this.st; if (!st) return;
    var list = this.outlines[i];
    if (!list && on) {
      list = this.outlines[i] = [];
      var meshes = [];
      st.people[i].root.traverse(function (o) { if (o.isMesh && !o.userData.isOutline) meshes.push(o); });
      var mat = new THREE.MeshBasicMaterial({ color: '#e0344b', side: THREE.BackSide });
      meshes.forEach(function (o) {
        var h = new THREE.Mesh(o.geometry, mat); h.userData.isOutline = true; h.scale.setScalar(1.14); o.add(h); list.push(h);
      });
    }
    (list || []).forEach(function (h) { h.visible = !!on; });
  }

  apply(style, pick) {
    var st = this.st; if (!st) return;
    var self = this;
    Object.keys(this.outlines).forEach(function (k) { self.outline(+k, false); });
    st.people.forEach(function (c, i) { if (c.dim) st.setDim(i, false); });
    if (pick < 0) return;
    if (style === 'outline') this.outline(pick, true);
    if (style === 'spot') st.people.forEach(function (c, i) { if (i !== pick && i !== ME) st.setDim(i, true); });
  }

  choose(i) {
    var st = this.st;
    if (this.state.pick === i) return;
    this.pickAt = performance.now();
    this.setState({ pick: i, preview: -1, pickKey: this.state.pickKey + 1 });
    this.apply(this.state.style, i);
    if (st) {
      var me = st.people[ME], c = st.people[i], dx = me.pos.x - c.pos.x, dz = me.pos.z - c.pos.z, d = Math.sqrt(dx * dx + dz * dz) || 1;
      st.walkTo(ME, c.pos.x + dx / d * 0.9, c.pos.z + dz / d * 0.9, false, 1.8);
    }
  }

  renderVals() {
    var self = this, s = this.state, cur = STYLES.filter(function (x) { return x[0] === s.style; })[0];
    return {
      caption: cur[2], isReticle: s.style === 'reticle', hasPick: s.pick >= 0, pickKey: s.pickKey,
      hint: s.pick >= 0 ? NAMES[s.pick][0] + ' 님을 노려요' : '이름표를 눌러 대상을 고르세요',
      reset: function () {
        self.setState({ pick: -1, preview: -1 }); self.apply(s.style, -1);
        if (self.st) self.st.setPhase('night', { view: 'mafia', me: ME }), self.st.ring('ally', ALLY_PICK, ALLY_RED, true);
      },
      people: NAMES.map(function (n, i) {
        var cand = i !== ME && i !== ALLY;
        var picked = s.pick === i, preview = s.preview === i && !picked;
        return {
          i: i, name: n[0], color: n[1], role: i === ME || i === ALLY ? 'mafia' : '',
          pe: cand ? 'auto' : 'none', disabled: cand ? undefined : true,
          cls: picked ? 'is-picked' : preview ? 'is-preview' : cand ? 'is-cand' : '',
          showMark: picked && s.style !== 'reticle',
          pressed: picked ? 'true' : 'false',
          label: n[0] + ' 님 노리기',
          down: function () { if (cand) self.setState({ preview: i }); },
          up: function () { if (self.state.preview === i) self.setState({ preview: -1 }); },
          pick: function () { if (cand) self.choose(i); }
        };
      }),
      styles: STYLES.map(function (m) {
        var on = s.style === m[0];
        return { label: m[1], pressed: on ? 'true' : 'false', bg: on ? '#e6e8ee' : '#1e2847', fg: on ? '#0e1326' : '#e6e8ee', pick: function () { self.setState({ style: m[0] }); self.apply(m[0], self.state.pick); } };
      })
    };
  }
}
</script>
</body>
</html>
