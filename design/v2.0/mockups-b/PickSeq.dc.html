<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>순차 지목</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/minifiav2/tokens.css">
<link rel="stylesheet" href="ds/minifiav2/components/bundle.css">
<script src="ds/minifiav2/components/bundle.js"></script>
<script src="./three.min.js"></script>
<script src="./character.js"></script>
<script src="./blockout.js"></script>
<script src="./bar.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e1326}
.sq-btn:focus-visible{outline:2px solid #e6e8ee;outline-offset:2px}
@keyframes sqFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--night-950); color: var(--gray-100); font-family: var(--font-ui); word-break: keep-all; user-select: none">

<canvas id="sdCanvas" aria-label="순차 지목. 8명이 가운데 모여 한 명씩 차례로 사람을 가리켜요" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; display: block"></canvas>

<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: rgba(6, 9, 20, 0.45); opacity: {{ dimOpacity }}; transition: opacity 500ms"></div>

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; pointer-events: none">
<sc-for list="{{ people }}" as="p" hint-placeholder-count="8">
<div id="sdPlate{{ p.i }}" style="position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; z-index: {{ p.z }}; opacity: {{ p.opacity }}">
<div style="position: absolute; left: 0; top: 0; transform: translate(-50%, -100%)">
<sc-if value="{{ p.pickable }}" hint-placeholder-val="{{ false }}">
<button type="button" class="sq-btn" onClick="{{ p.pick }}" aria-label="{{ p.pickLabel }}" style="pointer-events: auto; background: none; border: 0; padding: 8px; margin: -8px; border-radius: 12px; cursor: pointer; font: inherit; color: inherit">
<x-import component-from-global-scope="MinifiaV2.HeadStack" name="{{ p.name }}" color="{{ p.color }}" me="{{ p.me }}" blink="true" count="{{ p.count }}"></x-import>
</button>
</sc-if>
<sc-if value="{{ p.plain }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="MinifiaV2.HeadStack" name="{{ p.name }}" color="{{ p.color }}" me="{{ p.me }}" count="{{ p.count }}"></x-import>
</sc-if>
</div>
</div>
</sc-for>
</div>

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 120px; pointer-events: none; background: linear-gradient(to bottom, rgba(14, 19, 38, 0.88) 0px, rgba(14, 19, 38, 0.6) 70px, rgba(14, 19, 38, 0) 120px)"></div>
<div style="position: absolute; left: 0; top: 0; width: 390px; box-sizing: border-box; padding: 18px 16px 0; z-index: 40">
<x-import component-from-global-scope="MinifiaV2.PhaseHeader" title="지목" hint="{{ hint }}" show-hint="true" time="{{ time }}" total="{{ total }}"></x-import>
</div>

<div style="position: absolute; left: 16px; right: 16px; top: 100px; z-index: 44; display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 999px; background: rgba(21, 28, 54, 0.92); border: 1.5px solid {{ turnBorder }}; color: var(--gray-50); font-size: 17px; font-weight: 700">
<span style="font-size: 13px; color: #a9aebb; font-weight: 400">{{ turnNo }} / 8</span>
<span>{{ turnName }}</span>
<span style="font-size: 20px; font-variant-numeric: tabular-nums; color: {{ turnTone }}">{{ turnSec }}</span>
</div>
<div style="width: 220px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.14); overflow: hidden"><div style="height: 100%; width: {{ turnBar }}%; background: {{ turnTone }}; transition: width 900ms linear, background 300ms"></div></div>
<sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 15px; color: var(--gray-50); text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85); animation: sqFade 400ms both">{{ note }}</p>
</sc-if>
</div>

<section style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 14px 16px 22px; background: rgba(21, 28, 54, 0.97); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 10px; z-index: 50">
<div role="group" aria-label="시안 조절: 내 차례에 하는 행동" style="display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 12px; border: 1px dashed #3a4778">
<span style="font-size: 12px; color: #a9aebb; padding: 0 4px">시안</span>
<sc-for list="{{ modes }}" as="o" hint-placeholder-count="3">
<button type="button" class="sq-btn" onClick="{{ o.pick }}" aria-pressed="{{ o.pressed }}" style="flex: 1; min-height: 40px; border-radius: 8px; border: 0; background: {{ o.bg }}; color: {{ o.fg }}; font-family: inherit; font-size: 14px; cursor: pointer">{{ o.label }}</button>
</sc-for>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #a9aebb">{{ caption }}</p>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{ log }}" as="l" hint-placeholder-count="4">
<span style="font-size: 12px; padding: 4px 8px; border-radius: 8px; background: #1e2847; color: #e6e8ee">{{ l }}</span>
</sc-for>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var W = 390, H = 844, TURN = 8, ME = 0;
var NAMES = [['지호', '#7a8fb8'], ['민준', '#6fa59a'], ['서연', '#b89a6f'], ['도윤', '#b87a5c'], ['하은', '#a9aebb'], ['태오', '#8f86b0'], ['수아', '#7f9f7a'], ['현우', '#a88f9a']];
// 한 사람씩 누구를 가리킬지(-1 = 기권). 지호(0번, 나)는 시안 버튼에 따라 정해진다
var PICKS = [3, 3, 5, 0, 3, 3, 5, -1];
var MODES = [['pick', '내가 고름'], ['skip', '시간 초과(기권)'], ['bot', '봇 차례']];
var CAPTIONS = {
  pick: '모든 사람의 차례는 똑같이 8초부터 줄어듭니다. 내 차례가 오면 가운데로 한 걸음 나와 이름표가 깜빡입니다. 누르면 그 사람을 손가락으로 가리키고 바로 다음 사람으로 넘어갑니다.',
  skip: '8초 안에 고르지 못하면 기권이 되고, 자동으로 다음 사람 차례가 됩니다. 남은 3초부터 막대가 노랑에서 빨강으로 바뀝니다.',
  bot: '봇은 차례가 오면 바로 고르고 곧 넘어갑니다. 다른 사람 차례도 내 차례처럼 8초부터 줄어듭니다. 가리킨 표 수가 이름표 위에 쌓입니다.'
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'pick', turn: 0, sec: 8, counts: [0, 0, 0, 0, 0, 0, 0, 0], log: [], note: '', dim: 0, time: 8 };
  }

  componentDidMount() {
    var self = this;
    this.alive = true;
    (function boot() {
      if (!self.alive) return;
      var canvas = document.getElementById('sdCanvas');
      if (!window.THREE || !window.MFChar || !window.MFB || !MFB.CONCEPTS.bar || !canvas || !document.getElementById('sdPlate7')) { setTimeout(boot, 60); return; }
      self.start(canvas);
    })();
  }

  componentWillUnmount() {
    this.alive = false;
    cancelAnimationFrame(this.raf);
    if (this.io) this.io.disconnect();
    if (this.st) this.st.dispose();
  }

  start(canvas) {
    var self = this;
    canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); });
    var st = this.st = MFB.createStage(canvas, 'bar', { width: W, height: H, offsetY: 110 });
    this.restart();
    var plates = NAMES.map(function (n, i) { return document.getElementById('sdPlate' + i); });
    this.visible = true;
    if (window.IntersectionObserver) { this.io = new IntersectionObserver(function (es) { self.visible = es[0].isIntersecting; }); this.io.observe(canvas); }
    var last = performance.now(), acc = 0, sec = 0;
    function frame(now) {
      if (!self.alive) return;
      var dt = Math.min((now - last) / 1000, 0.1); last = now; acc += dt;
      if (self.visible && !document.hidden && acc >= 1 / 30) {
        var step = Math.min(acc, 0.05);
        st.frame(step);
        sec += acc;
        if (sec >= 1) { sec = 0; self.second(); }
        st.people.forEach(function (c, i) {
          var el = plates[i]; if (!el) return;
          el.style.transform = 'translate(' + c.sx.toFixed(1) + 'px,' + c.sy.toFixed(1) + 'px)';
        });
        acc = 0;
      }
      self.raf = requestAnimationFrame(frame);
    }
    this.raf = requestAnimationFrame(frame);
  }

  // 처음부터 다시: 모두 가운데 모이는 장면으로 시작
  restart() {
    var st = this.st;
    this.gather = 3;
    this.setState({ turn: 0, sec: 8, counts: [0, 0, 0, 0, 0, 0, 0, 0], log: [], note: '가운데로 모여요', dim: 0.4, time: 8 });
    if (st) { st.setPhase('talk', { me: ME }); st.ring('turn', 0, '#e6e8ee', false); }
  }

  // 한 사람이 차례에 쓸 수 있는 시간(봇은 1초)
  limit(t) { return 8; }

  second() {
    var s = this.state, st = this.st;
    if (this.gather < 0) { this.gather += 1; if (this.gather === 0) this.restart(); return; }
    if (this.gather > 0) {
      this.gather -= 1;
      if (this.gather === 2) st.setPhase('vote', { me: ME });
      if (this.gather === 0) this.beginTurn(0);
      return;
    }
    var t = s.turn, lim = this.limit(t);
    var sec = s.sec - 1;
    if (s.picked) return;
    if (t !== ME && (s.mode === 'bot' || sec <= 5)) { this.resolve(t, PICKS[t]); return; }
    if (sec <= 0) { this.resolve(t, t === ME ? (s.mode === 'skip' ? -1 : PICKS[t]) : PICKS[t]); return; }
    this.setState({ sec: sec, time: sec });
  }

  beginTurn(t) {
    var st = this.st, s = this.state;
    if (t >= TURN) { this.setState({ note: '모두 골랐어요 · 도윤 님 5표', dim: 0, sec: 0 }); this.gather = -4; return; }
    st.ring('turn', t, '#e6e8ee', true);
    var lim = this.limit(t);
    this.setState({ turn: t, sec: lim, time: lim, note: t === ME ? (s.mode === 'bot' ? '' : '의심되는 사람을 눌러요') : '', picked: false });
  }

  resolve(t, target) {
    var st = this.st, s = this.state, counts = s.counts.slice(), log = s.log.slice(-5);
    if (target >= 0) { st.pointAt(t, target); counts[target] += 1; log.push(NAMES[t][0] + ' → ' + NAMES[target][0]); }
    else log.push(NAMES[t][0] + ' · 기권');
    this.setState({ counts: counts, log: log, picked: true, note: target >= 0 ? NAMES[t][0] + ' 님이 ' + NAMES[target][0] + ' 님을 가리켜요' : NAMES[t][0] + ' 님이 고르지 못했어요', sec: 1 });
    var self = this;
    setTimeout(function () { if (self.alive) self.beginTurn(t + 1); }, 900);
    this.turnLock = true;
  }

  myPick(target) {
    var s = this.state;
    if (this.gather > 0 || s.turn !== ME || s.picked || s.mode !== 'pick') return;
    this.resolve(ME, target);
  }

  renderVals() {
    var self = this, s = this.state, turn = Math.min(s.turn, TURN - 1), lim = this.limit(turn);
    var warn = s.sec <= 3 && s.sec > 0 && turn === ME;
    var tone = warn ? '#d9533f' : (s.sec <= 5 && turn === ME ? '#d6a642' : '#e6e8ee');
    var myTurn = s.turn === ME && !s.picked && s.mode === 'pick' && this.gather <= 0;
    return {
      dimOpacity: s.dim, hint: myTurn ? '의심되는 사람을 눌러요' : (this.gather > 0 ? '모이는 중' : ' '),
      time: s.time, total: lim, turnNo: turn + 1, turnName: NAMES[turn][0] + ' 님 차례', turnSec: s.sec + '초', turnBar: Math.max(0, Math.min(100, s.sec / lim * 100)),
      turnTone: tone, turnBorder: tone, hasNote: !!s.note, note: s.note, caption: CAPTIONS[s.mode], log: s.log,
      people: NAMES.map(function (n, i) {
        return { i: i, name: n[0], color: n[1], me: i === ME, count: s.counts[i], pickable: myTurn && i !== ME, plain: !(myTurn && i !== ME),
          pick: function () { self.myPick(i); }, pickLabel: n[0] + ' 님 가리키기', z: i === s.turn ? 20 : 10, opacity: 1 };
      }),
      modes: MODES.map(function (m) {
        var on = s.mode === m[0];
        return { label: m[1], pressed: on ? 'true' : 'false', bg: on ? '#e6e8ee' : '#1e2847', fg: on ? '#0e1326' : '#e6e8ee', pick: function () { self.setState({ mode: m[0] }); self.restart(); } };
      })
    };
  }
}
</script>
</body>
</html>
