<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>유언</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/minifiav2/tokens.css">
<link rel="stylesheet" href="ds/minifiav2/components/bundle.css">
<script src="ds/minifiav2/components/bundle.js"></script>
<script src="./three.min.js"></script>
<script src="./character.js"></script>
<script src="./blockout.js"></script>
<script src="./bar.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;family=Gowun+Batang:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e1326}
.sd-btn:focus-visible{outline:2px solid #e6e8ee;outline-offset:2px}
@keyframes sdFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sdBeat{0%,100%{opacity:.25}12%{opacity:.85}24%{opacity:.35}36%{opacity:.7}}
@keyframes sdFlash{0%{opacity:0}15%{opacity:.8}100%{opacity:0}}
@keyframes sdSlash{0%{transform:rotate(-28deg) scaleX(0);opacity:1}40%{transform:rotate(-28deg) scaleX(1);opacity:1}100%{transform:rotate(-28deg) scaleX(1);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--night-950); color: var(--gray-100); font-family: var(--font-ui); word-break: keep-all; user-select: none; -webkit-user-select: none">

<canvas id="sdCanvas" aria-label="{{ sceneLabel }}" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; display: block; cursor: {{ floorCursor }}"></canvas>

<sc-if value="{{ pulse }}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 45%, rgba(110, 12, 26, 0.55) 100%); animation: sdBeat 1.3s ease-in-out infinite"></div>
</sc-if>

<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: rgba(6, 9, 20, 0.62); opacity: {{ dimOpacity }}; transition: opacity 420ms"></div>

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; pointer-events: none">
<sc-for list="{{ people }}" as="p" hint-placeholder-count="8">
<div id="sdPlate{{ p.i }}" style="position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; z-index: {{ p.z }}; opacity: {{ p.opacity }}">
<div style="position: absolute; left: 0; top: 0; transform: translate(-50%, -100%)">
<sc-if value="{{ p.pickable }}" hint-placeholder-val="{{ false }}">
<button type="button" class="sd-btn" onClick="{{ p.pick }}" aria-label="{{ p.pickLabel }}" style="pointer-events: auto; background: none; border: 0; padding: 8px; margin: -8px; border-radius: 12px; cursor: pointer; font: inherit; color: inherit">
<x-import component-from-global-scope="MinifiaV2.HeadStack" name="{{ p.name }}" color="{{ p.color }}" me="{{ p.me }}" mine="{{ p.mine }}" role="{{ p.role }}" count="{{ p.count }}" sure="{{ p.sure }}" sure-label="확정"></x-import>
</button>
</sc-if>
<sc-if value="{{ p.plain }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="MinifiaV2.HeadStack" name="{{ p.name }}" color="{{ p.color }}" me="{{ p.me }}" role="{{ p.role }}" count="{{ p.count }}" sure="{{ p.sure }}" sure-label="확정"></x-import>
</sc-if>
</div>
</div>
</sc-for>
</div>

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 120px; pointer-events: none; background: linear-gradient(to bottom, rgba(14, 19, 38, 0.88) 0px, rgba(14, 19, 38, 0.6) 70px, rgba(14, 19, 38, 0) 120px)"></div>
<div style="position: absolute; left: 0; top: 0; width: 390px; box-sizing: border-box; padding: 18px 16px 0; z-index: 40">
<x-import component-from-global-scope="MinifiaV2.PhaseHeader" title="{{ phaseTitle }}" hint="{{ phaseHint }}" show-hint="{{ showHint }}" time="{{ time }}" total="{{ total }}"></x-import>
</div>

<sc-if value="{{ hasScenario }}" hint-placeholder-val="{{ false }}">
<div role="group" aria-label="시안 조절: 지난밤 결과" style="position: absolute; left: 16px; right: 16px; top: 92px; z-index: 46; display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 12px; border: 1px dashed #4a5680; background: rgba(14, 19, 38, 0.8)">
<span style="font-size: 12px; color: #a9aebb; padding: 0 4px">시안</span>
<sc-for list="{{ scenarios }}" as="o" hint-placeholder-count="3">
<button type="button" class="sd-btn" onClick="{{ o.pick }}" aria-pressed="{{ o.pressed }}" style="flex: 1; min-height: 32px; border-radius: 8px; border: 0; background: {{ o.bg }}; color: {{ o.fg }}; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{ o.label }}</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ hasAnnounce }}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 16px; right: 16px; top: 230px; text-align: center; z-index: 45; animation: sdFade 600ms both; display: flex; flex-direction: column; align-items: center; gap: 12px">
<sc-if value="{{ hasAnnounceIcon }}" hint-placeholder-val="{{ false }}"><span style="color: {{ announceColor }}"><x-import component-from-global-scope="MinifiaV2.Icon" name="{{ announceIcon }}" size="56"></x-import></span></sc-if>
<p style="margin: 0; font-size: 34px; line-height: 1.2; font-weight: 700; color: var(--gray-50); text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8)">{{ announce }}</p>
</div>
</sc-if>

<sc-if value="{{ hasResult }}" hint-placeholder-val="{{ false }}">
<div role="status" aria-label="{{ resultAria }}" style="position: absolute; left: 0; right: 0; top: 170px; z-index: 60; display: flex; justify-content: center; animation: sdFade 500ms both">
<div style="width: 220px; box-sizing: border-box; padding: 16px; border-radius: 20px; background: #151c36; border: 2px solid {{ resultBorder }}; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; gap: 10px">
<img src="{{ resultImg }}" alt="" draggable="false" style="width: 140px; height: 140px; object-fit: contain">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 700; color: {{ resultColor }}"><x-import component-from-global-scope="MinifiaV2.Icon" name="{{ resultIcon }}" size="28"></x-import>{{ resultText }}</span>
</div>
</div>
</sc-if>

<sc-if value="{{ killFx }}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="position: absolute; inset: 0; z-index: 70; pointer-events: none">
<div style="position: absolute; inset: 0; background: #8a0f22; animation: sdFlash 900ms ease-out both"></div>
<div style="position: absolute; left: -40px; right: -40px; top: 400px; height: 4px; background: linear-gradient(90deg, rgba(255, 220, 225, 0), #ffe3e8 30%, #ffe3e8 70%, rgba(255, 220, 225, 0)); box-shadow: 0 0 18px #ff3b55; transform-origin: 0 50%; animation: sdSlash 700ms cubic-bezier(.2,.8,.2,1) both"></div>
</div>
</sc-if>

<sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 10px; right: 10px; bottom: {{ sheetBottom }}px; z-index: 100">
<x-import component-from-global-scope="MinifiaV2.WillSheet" title="{{ sheetTitle }}" icon="{{ sheetIcon }}" tone="{{ sheetTone }}" placeholder="{{ sheetPlaceholder }}" value="{{ sheetValue }}" on-change="{{ sheetChange }}" on-save="{{ sheetSave }}" saved="{{ sheetSaved }}" on-close="{{ sheetClose }}" input-id="sdWill"></x-import>
</div>
</sc-if>

<sc-if value="{{ hasPanel }}" hint-placeholder-val="{{ true }}">
<section style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 14px 16px 22px; background: rgba(21, 28, 54, 0.97); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 10px; z-index: 50">
<sc-if value="{{ hasFaces }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="MinifiaV2.FaceList" faces="{{ faces }}" value="{{ facePick }}" on-pick="{{ pickFace }}" icon="{{ faceIcon }}" label="{{ faceLabel }}"></x-import>
</sc-if>
<sc-if value="{{ hasChat }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="MinifiaV2.ChatPanel" messages="{{ chat }}" value="{{ draft }}" on-change="{{ setDraft }}" on-send="{{ send }}" emotes="{{ emotes }}" on-emote="{{ pickEmote }}" on-will="{{ onWill }}" will-open="{{ willOpen }}" placeholder="{{ chatPlaceholder }}" input-id="sdChatInput"></x-import>
</sc-if>
<sc-if value="{{ hasActions }}" hint-placeholder-val="{{ true }}">
<div role="group" aria-label="행동" style="display: grid; grid-template-columns: repeat({{ actionCols }}, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ actions }}" as="a" hint-placeholder-count="1">
<button type="button" class="sd-btn" onClick="{{ a.pick }}" aria-pressed="{{ a.pressed }}" aria-label="{{ a.label }}" disabled="{{ a.disabled }}" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 12px; border-radius: 14px; border: 1px solid {{ a.border }}; background: {{ a.bg }}; color: {{ a.fg }}; font-family: inherit; font-size: 16px; font-weight: 700; cursor: {{ a.cursor }}; opacity: {{ a.opacity }}">
<x-import component-from-global-scope="MinifiaV2.Icon" name="{{ a.icon }}" size="22"></x-import>
<span>{{ a.label }}</span>
</button>
</sc-for>
</div>
</sc-if>
</section>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var SCREEN = 'will', W = 390, H = 844;
var NAMES = [['지호', '#7a8fb8'], ['민준', '#6fa59a'], ['서연', '#b89a6f'], ['도윤', '#b87a5c'], ['하은', '#a9aebb'], ['태오', '#8f86b0'], ['수아', '#7f9f7a'], ['현우', '#a88f9a']];
var EMOTES = [['throat', '목 긋기'], ['deny', '나 아니야'], ['clap', '박수'], ['cry', '엉엉'], ['handshake', '악수'], ['point', '손가락질'], ['praise', '최고'], ['surprise', '깜짝'], ['dance', '춤']];
var FACE = ['/_blob/3d2b0d5370e6235b2a65dd9fa3bb4e62', '/_blob/edaab7cf7b28a0e8c81ba9a0b28d315a', '/_blob/ec8169726525383387f1b0186abd93c1', '/_blob/c0cb674cde82a8b45d81751c9fc9f176',
  '/_blob/15b5c64d1a3c9f15e86783f70fe892f3', '/_blob/eb1af9ecb8c13805a5b8594f286c17b3', '/_blob/38253966d7577ed118208beef72dd6cf', '/_blob/294800d4f27162520a19f79187ade63b'];
// 이번 판: 수아·현우 마피아, 민준 경찰, 하은 의사. 도윤은 어제 낮에 처형되어 유령이다
var ROLES = ['citizen', 'police', 'citizen', 'citizen', 'doctor', 'citizen', 'mafia', 'mafia'];
var MAFIA = [6, 7], EXECUTED = 3, VICTIM = 2, CRIMSON = '#c8102e';
var SYS = 'system', HOT = 'hot';
var CFG = {
  nightMafia: { view: 'mafia', me: 6, title: '밤', hint: '대상에게 다가가요', time: 30, label: '마피아의 밤. 동료와 시민이 모두 보이고, 이름표를 누르면 그 사람에게 걸어가요' },
  nightCitizen: { view: 'citizen', me: 0, title: '밤', hint: '날이 밝길 기다려요', time: 30, label: '시민의 밤. 깜깜해서 나만 보여요' },
  nightPolice: { view: 'citizen', me: 1, title: '밤', hint: '조사할 사람을 골라요', time: 30, start: 12, label: '경찰의 밤. 얼굴 목록에서 조사할 사람을 골라요' },
  nightDoctor: { view: 'citizen', me: 4, title: '밤', hint: '지킬 사람을 골라요', time: 30, start: 12, label: '의사의 밤. 얼굴 목록에서 지킬 사람을 골라요' },
  killed: { view: 'citizen', me: VICTIM, title: '밤', hint: '', time: 30, start: 4, label: '암살당하는 순간. 화면이 붉게 번쩍이고 유령이 돼요' },
  morning: { phase: 'morning', me: 0, title: '아침', hint: '', time: 8, label: '아침. 쓰러진 자리에 분필 윤곽이 남아요' },
  will: { view: 'citizen', me: 0, title: '밤', hint: '', time: 30, start: 22, label: '유언 쓰기. 깃펜을 눌러 언제든 쓰고 고쳐요' },
  ghost: { view: 'ghost', me: EXECUTED, title: '유령', hint: '모두의 직업과 밤 행동이 보여요', time: 30, label: '유령 관전. 모두의 직업과 마피아의 움직임이 보여요' }
};
var CHAT0 = {
  nightMafia: [[SYS, '밤 · 마피아 채팅', 'roleMafia'], [7, '오늘은 누구로 해요?']],
  morning: [],
  ghost: [[SYS, '유령 채팅 · 산 사람에게 안 보여요', 'ghost'], [7, '서연 님 어때요?', 'mafia']]
};
var WILL = '현우 님 말투가 이상해요', NOTE = '다음은 너야';
var SCENARIOS = [['kill', '암살'], ['saved', '살아남'], ['quiet', '조용한 밤']];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.initial('kill');
  }

  initial(scenario) {
    var cfg = CFG[SCREEN];
    return {
      time: cfg.start || cfg.time, draft: '', chat: this.chat0(), showHint: !!cfg.hint, scenario: scenario,
      myPick: -1, matePick: -1, facePick: '', result: false, announce: '', fx: false, dead: false,
      sheet: SCREEN === 'will' ? 'will' : '', will: SCREEN === 'will' ? WILL : '', willSaved: false, note: '', noteSaved: false
    };
  }

  chat0() {
    return (CHAT0[SCREEN] || []).map(function (m) {
      return typeof m[0] === 'number' ? { kind: 'player', name: NAMES[m[0]][0], color: NAMES[m[0]][1], text: m[1], channel: m[2] || (SCREEN === 'nightMafia' ? 'mafia' : 'ghost') } : { kind: m[0], text: m[1], icon: m[2] };
    });
  }

  componentDidMount() {
    var self = this;
    this.alive = true;
    (function boot() {
      if (!self.alive) return;
      var canvas = document.getElementById('sdCanvas');
      if (!window.THREE || !window.MFChar || !window.MFB || !MFB.CONCEPTS.bar || !canvas || !document.getElementById('sdPlate7')) { setTimeout(boot, 60); return; }
      self.start(canvas);
    })();
  }

  componentWillUnmount() {
    this.alive = false;
    cancelAnimationFrame(this.raf);
    if (this.io) this.io.disconnect();
    if (this.st) this.st.dispose();
  }

  start(canvas) {
    var self = this;
    canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); });
    var st = this.st = MFB.createStage(canvas, 'bar', { width: W, height: H, offsetY: 110 });
    // 바닥을 누르면 그쪽으로 걸어간다(마피아·유령만)
    var ray = new THREE.Raycaster(), floor = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
    canvas.addEventListener('click', function (e) {
      if (!self.canWalk()) return;
      var r = canvas.getBoundingClientRect();
      ray.setFromCamera({ x: (e.clientX - r.left) / r.width * 2 - 1, y: -(e.clientY - r.top) / r.height * 2 + 1 }, st.camera);
      if (!ray.ray.intersectPlane(floor, hit)) return;
      st.walkTo(CFG[SCREEN].me, Math.max(-5.8, Math.min(5.8, hit.x)), Math.max(-5.8, Math.min(5.8, hit.z)));
    });
    this.reset(this.state.scenario);
    var plates = NAMES.map(function (n, i) { return document.getElementById('sdPlate' + i); });
    this.visible = true;
    if (window.IntersectionObserver) { this.io = new IntersectionObserver(function (es) { self.visible = es[0].isIntersecting; }); this.io.observe(canvas); }
    var last = performance.now(), acc = 0, sec = 0;
    function frame(now) {
      if (!self.alive) return;
      var dt = Math.min((now - last) / 1000, 0.1); last = now; acc += dt;
      if (self.visible && !document.hidden && acc >= 1 / 30) {
        var step = Math.min(acc, 0.05);
        st.frame(step);
        self.tick(step);
        sec += acc;
        if (sec >= 1) { sec = 0; self.second(); }
        st.people.forEach(function (c, i) {
          var el = plates[i]; if (!el) return;
          el.style.transform = 'translate(' + c.sx.toFixed(1) + 'px,' + c.sy.toFixed(1) + 'px)';
        });
        acc = 0;
      }
      self.raf = requestAnimationFrame(frame);
    }
    this.raf = requestAnimationFrame(frame);
  }

  canWalk() { return SCREEN === 'nightMafia' || SCREEN === 'ghost'; }

  // 이 화면에서 보이지 않는 사람: 처형된 도윤(산 사람에게 유령은 안 보인다), 아침에 당한 사람
  hidden(i, s) {
    var cfg = CFG[SCREEN];
    if (cfg.view === 'citizen') return i !== cfg.me;
    if (i === EXECUTED) return SCREEN !== 'ghost';
    if (SCREEN === 'morning' && s.scenario === 'kill' && i === VICTIM) return true;
    return false;
  }

  reset(scenario) {
    var cfg = CFG[SCREEN], st = this.st, self = this;
    this.clock = 0; this.endAt = 0; this.events = {};
    var s = this.initial(scenario || this.state.scenario);
    if (SCREEN === 'will') { s.will = this.state.will || WILL; s.willSaved = this.state.willSaved; }
    this.setState(s);
    if (!st) return;
    st.setPhase(cfg.phase || 'night', { view: cfg.view, me: cfg.me });
    ['pick', 'mate', 'police', 'doctor'].forEach(function (k) { st.ring(k, 0, CRIMSON, false); });
    st.chalk(0, 0, false);
    st.people.forEach(function (c, i) { if (self.hidden(i, s)) c.root.visible = false; });
    if (SCREEN === 'ghost') st.setGhost(EXECUTED, true);
    if (SCREEN === 'morning' && s.scenario === 'kill') { var v = st.ctx.talk[VICTIM]; st.chalk(v.x, v.z, true); }
  }

  second() {
    var s = this.state;
    if (s.time == null) return;
    if (s.time <= 1) { if (!this.endAt) this.end(); return; }
    this.setState({ time: s.time - 1 });
  }

  // 단계가 끝날 때: 경찰은 결과를 보고, 나머지는 잠시 뒤 처음부터 다시 재생한다
  end() {
    var s = this.state;
    this.endAt = this.clock;
    var o = { time: 0 };
    if (SCREEN === 'nightPolice' && s.facePick !== '') {
      var t = +s.facePick, maf = ROLES[t] === 'mafia';
      o.result = true;
      o.chat = s.chat.concat([{ kind: 'card', icon: 'eye', title: NAMES[t][0], text: maf ? '마피아' : '마피아 아님' }]);
    }
    this.setState(o);
  }

  once(key, at) { if (this.events[key] || this.clock < at) return false; this.events[key] = true; return true; }

  say(list, kind, text, icon) { return list.concat([{ kind: kind, text: text, icon: icon }]); }
  talk(list, i, text, channel) { return list.concat([{ kind: 'player', name: NAMES[i][0], color: NAMES[i][1], text: text, channel: channel }]); }

  // 마피아: i 번이 t 번 쪽으로 걸어가 옆에 선다
  approach(i, t) {
    var a = this.st.people[i].pos, b = this.st.people[t].pos, dx = a.x - b.x, dz = a.z - b.z, d = Math.sqrt(dx * dx + dz * dz) || 1;
    this.st.walkTo(i, b.x + dx / d * 0.8, b.z + dz / d * 0.8);
  }

  tick(dt) {
    this.clock += dt;
    var s = this.state, st = this.st, self = this;
    if (s.showHint && this.clock > 2.5) this.setState({ showHint: false });
    if (this.endAt && this.clock > this.endAt + (s.result ? 3.5 : SCREEN === 'killed' ? 4.5 : 1.2)) { this.reset(); return; }
    if (SCREEN === 'nightMafia' && this.once('mate', 2)) {
      this.approach(7, VICTIM); st.ring('mate', VICTIM, '#e0344b', true);
      var mc = this.talk(s.chat, 7, '서연 님 쪽으로 가요', 'mafia');
      if (s.myPick === VICTIM) mc = this.say(mc, HOT, NAMES[VICTIM][0] + ' · 확정', 'target');
      this.setState({ matePick: VICTIM, chat: mc });
    }
    if (SCREEN === 'killed') {
      if (this.endAt && this.once('kill', this.endAt + 0.05)) this.setState({ fx: true });
      if (this.endAt && this.once('ghost', this.endAt + 0.7)) { st.setGhost(VICTIM, true); MFChar.setFace(st.people[VICTIM], 'surprise'); this.setState({ dead: true, announce: '암살당했어요' }); }
    }
    if (SCREEN === 'morning') {
      var sc = s.scenario;
      if (this.once('ann', 0.4)) this.setState({ announce: sc === 'kill' ? '서연 님이 당했어요' : sc === 'saved' ? '누군가 살아났습니다' : '아무 일도 없었어요' });
      if (this.once('cards', 2.8)) {
        var chat = s.chat;
        if (sc === 'kill') {
          chat = chat.concat([{ kind: 'card', icon: 'quill', title: '서연 님의 유언', text: WILL }, { kind: 'card', icon: 'note', tone: 'mafia', title: '쪽지', text: NOTE }]);
        }
        this.setState({ announce: '', chat: chat });
      }
    }
    if (SCREEN === 'ghost') {
      if (this.once('m1', 1.2)) { this.approach(6, VICTIM); this.approach(7, VICTIM); st.ring('pick', VICTIM, CRIMSON, true); this.setState({ chat: this.talk(s.chat, 6, '좋아요, 같이 가요', 'mafia') }); }
      if (this.once('p1', 2.2)) { st.ring('police', 6, '#7a8fb8', true); st.ring('doctor', 0, '#6fa59a', true); }
    }
  }

  // 마피아가 이름표를 누름: 그 사람에게 걸어가고 발밑에 고리
  mafiaPick(t) {
    var s = this.state, me = CFG[SCREEN].me;
    if (t === s.myPick) return;
    this.approach(me, t);
    this.st.ring('pick', t, CRIMSON, true);
    var chat = s.chat;
    if (t === s.matePick) chat = this.say(chat, HOT, NAMES[t][0] + ' · 확정', 'target');
    this.setState({ myPick: t, chat: chat });
  }

  renderVals() {
    var self = this, s = this.state, cfg = CFG[SCREEN], me = cfg.me;
    var mafiaView = SCREEN === 'nightMafia', ghostView = SCREEN === 'ghost';
    var sure = mafiaView && s.myPick >= 0 && s.myPick === s.matePick;
    function act(o) {
      var on = !!o.on;
      return { label: o.label, icon: o.icon, pressed: on ? 'true' : 'false', disabled: !!o.disabled, cursor: o.disabled ? 'default' : 'pointer', opacity: o.disabled ? 0.45 : 1,
        bg: on ? '#e6e8ee' : o.mafia ? 'rgba(138, 15, 34, 0.35)' : '#1e2847', fg: on ? '#0e1326' : o.mafia ? '#f1a5b0' : '#e6e8ee', border: on ? '#e6e8ee' : o.mafia ? '#8a0f22' : '#2a3760', pick: o.pick || function () {} };
    }
    function open(kind) { return function () { self.setState({ sheet: s.sheet === kind ? '' : kind }); }; }
    var actions = [];
    if (mafiaView) actions.push(act({ icon: 'note', label: '쪽지', mafia: true, on: s.sheet === 'note', disabled: !sure, pick: open('note') }));
    if (cfg.view === 'citizen' && !s.dead) actions.push(act({ icon: 'quill', label: '유언', on: s.sheet === 'will', pick: open('will') }));
    var faces = [];
    if (SCREEN === 'nightPolice' || SCREEN === 'nightDoctor') {
      faces = NAMES.map(function (n, i) { return { id: String(i), name: n[0], img: FACE[i], color: n[1] }; })
        .filter(function (f) { return +f.id !== EXECUTED && (SCREEN === 'nightDoctor' || +f.id !== me); });
    }
    var hasChat = mafiaView || ghostView || SCREEN === 'morning';
    var sheetKind = s.sheet, note = sheetKind === 'note';
    var resT = s.result ? +s.facePick : -1, resMafia = resT >= 0 && ROLES[resT] === 'mafia';
    var ann = s.announce, annIcon = SCREEN === 'killed' ? 'ghost' : SCREEN === 'morning' ? (s.scenario === 'saved' ? 'heal' : s.scenario === 'kill' ? 'target' : '') : '';
    return {
      sceneLabel: cfg.label, floorCursor: this.canWalk() ? 'pointer' : 'default',
      phaseTitle: cfg.title, phaseHint: cfg.hint, showHint: s.showHint, time: s.time, total: cfg.time,
      pulse: cfg.view === 'citizen' && !s.dead,
      dimOpacity: ann || s.result ? 1 : 0,
      hasScenario: SCREEN === 'morning',
      scenarios: SCENARIOS.map(function (o) {
        var on = s.scenario === o[0];
        return { label: o[1], pressed: on ? 'true' : 'false', bg: on ? '#e6e8ee' : 'transparent', fg: on ? '#0e1326' : '#c3c7d1', pick: function () { self.reset(o[0]); } };
      }),
      hasAnnounce: !!ann, announce: ann, hasAnnounceIcon: !!annIcon, announceIcon: annIcon || 'ghost', announceColor: annIcon === 'target' ? '#e0344b' : '#c3c7d1',
      hasResult: resT >= 0, resultImg: resT >= 0 ? FACE[resT] : '', resultIcon: resMafia ? 'roleMafia' : 'check', resultText: resMafia ? '마피아' : '마피아 아님',
      resultColor: resMafia ? '#f1a5b0' : '#e6e8ee', resultBorder: resMafia ? '#c8102e' : '#4a5680', resultAria: resT >= 0 ? NAMES[resT][0] + ' 조사 결과' : '',
      killFx: s.fx,
      people: NAMES.map(function (n, i) {
        var hid = self.hidden(i, s), pick = mafiaView && MAFIA.indexOf(i) < 0 && !hid;
        var c = mafiaView ? (s.myPick === i ? 1 : 0) + (s.matePick === i ? 1 : 0) : 0;
        var role = ghostView ? ROLES[i] : mafiaView && MAFIA.indexOf(i) >= 0 ? 'mafia' : '';
        return {
          i: i, name: n[0], color: n[1], me: i === me, role: role, count: sure ? 0 : c, sure: sure && s.myPick === i, mine: mafiaView && s.myPick === i,
          pickable: pick, plain: !pick, pick: function () { self.mafiaPick(i); }, pickLabel: n[0] + ' 님에게 다가가기',
          z: c > 0 ? 12 : 10, opacity: hid ? 0 : (SCREEN === 'killed' && s.dead) || (ghostView && i === EXECUTED) ? 0.6 : 1
        };
      }),
      sheetOpen: !!sheetKind, sheetBottom: hasChat ? 268 : 100,
      sheetTitle: note ? '쪽지' : '유언', sheetIcon: note ? 'note' : 'quill', sheetTone: note ? 'mafia' : '', sheetPlaceholder: note ? '이름 없이 아침에 공개돼요' : '죽으면 모두에게 보여요',
      sheetValue: note ? s.note : s.will, sheetSaved: note ? s.noteSaved : s.willSaved,
      sheetChange: function (v) { self.setState(note ? { note: v, noteSaved: false } : { will: v, willSaved: false }); },
      sheetSave: function () { self.setState(note ? { noteSaved: true } : { willSaved: true }); },
      sheetClose: function () { self.setState({ sheet: '' }); },
      hasPanel: hasChat || faces.length > 0 || actions.length > 0,
      hasFaces: faces.length > 0, faces: faces, facePick: s.facePick, faceIcon: SCREEN === 'nightPolice' ? 'eye' : 'heal', faceLabel: SCREEN === 'nightPolice' ? '조사할 사람' : '지킬 사람',
      pickFace: function (id) { if (!self.endAt) self.setState({ facePick: id }); },
      hasChat: hasChat, chat: s.chat.slice(-5), draft: s.draft, chatPlaceholder: mafiaView ? '마피아끼리만 보여요' : ghostView ? '유령끼리만 보여요' : '',
      setDraft: function (v) { self.setState({ draft: v }); },
      send: function (v) { self.setState({ draft: '', chat: self.talk(s.chat, me, v, mafiaView ? 'mafia' : ghostView ? 'ghost' : undefined) }); },
      emotes: ghostView ? [] : EMOTES.map(function (e) { return { id: e[0], label: e[1] }; }),
      pickEmote: function (id) { if (self.st) self.st.emote(me, id); },
      // 채팅 입력줄이 있으면 깃펜은 감정표현 옆, 없으면(시민 편 밤) 아래 행동 버튼
      onWill: mafiaView || SCREEN === 'morning' ? open('will') : null, willOpen: s.sheet === 'will',
      hasActions: actions.length > 0, actions: actions, actionCols: Math.max(1, actions.length)
    };
  }
}
</script>
</body>
</html>
