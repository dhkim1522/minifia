<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>미니피아 · 작은 재즈 바 시안</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header class="review-header">
      <div>
        <p>미니피아 디자인 시안</p>
        <h1>작은 재즈 바</h1>
        <p>4인과 8인 토론을 같은 시점과 확대율로 비교합니다.</p>
      </div>
      <figure class="layout">
        <div id="floor-plan" class="floor-plan" role="img" aria-label="정사각형 재즈 바 한가운데에 스탠드가 있고, 여덟 좌석이 둘레에 있습니다."></div>
        <figcaption><strong>재즈 바 배치</strong><span>중앙 스탠드 · 8석</span></figcaption>
      </figure>
    </header>
    <nav class="review-nav" aria-label="비교 장면">
      <button type="button" data-show="walk" aria-pressed="false">이동</button>
      <button type="button" data-show="four" aria-pressed="false">4인 토론</button>
      <button type="button" data-show="eight" aria-pressed="true">8인 토론</button>
    </nav>
    <div class="review-grid">
      <section data-panel="walk" aria-labelledby="walk-title">
        <header class="panel-header"><h2 id="walk-title">대기실</h2><p>중앙 좌석 둘레로 짧게 이동</p></header>
        <div class="phone">
          <header class="game-header"><b>대기실</b><span>재즈 바</span><span>8명</span></header>
          <div class="world" id="walk-world" aria-label="바닥을 눌러 움직이는 재즈 바"></div>
          <div class="game-action"><span>바닥을 눌러 걸어보세요</span><button type="button" id="gather">중앙에 모이기</button></div>
          <div class="chat"><div class="chat-line"><b>서연</b> 가운데에서 얘기할까요?</div><div class="chat-line"><b>민준</b> 좋아요.</div><div class="chat-input">메시지 보내기 <span aria-hidden="true">➤</span></div></div>
        </div>
      </section>
      <section data-panel="four" aria-labelledby="four-title">
        <header class="panel-header"><h2 id="four-title">4인 토론</h2><p>빈자리 4석</p></header>
        <div class="phone">
          <header class="game-header"><b>토론</b><span class="timer" aria-hidden="true"></span><span>4명</span></header>
          <div class="world" id="four-world" role="group" aria-label="중앙 스탠드 둘레 여덟 자리 중 네 자리에 모인 사람들"></div>
          <div class="discussion-line" id="four-line" aria-live="polite"></div>
          <div class="game-action"><button type="button" aria-pressed="false" data-note="four">의심딱지</button><span data-status="four" aria-live="polite">이름표를 눌러 발언 확인</span></div>
          <div class="chat"><div class="chat-line"><b>지호</b> 나는 창가 쪽에 있었어.</div><div class="chat-line"><b>민준</b> 그때 피아노 소리는 안 들렸어?</div><div class="chat-input">메시지 보내기 <span aria-hidden="true">➤</span></div></div>
        </div>
      </section>
      <section data-panel="eight" class="shown" aria-labelledby="eight-title">
        <header class="panel-header"><h2 id="eight-title">8인 토론</h2><p>모든 자리 사용</p></header>
        <div class="phone">
          <header class="game-header"><b>토론</b><span class="timer" aria-hidden="true"></span><span>8명</span></header>
          <div class="world" id="eight-world" role="group" aria-label="중앙 스탠드 둘레 여덟 자리에 모인 사람들"></div>
          <div class="discussion-line" id="eight-line" aria-live="polite"></div>
          <div class="game-action"><button type="button" aria-pressed="false" data-note="eight">의심딱지</button><span data-status="eight" aria-live="polite">이름표를 눌러 발언 확인</span></div>
          <div class="chat"><div class="chat-line"><b>지호</b> 나는 창가 쪽에 있었어.</div><div class="chat-line"><b>민준</b> 그때 피아노 소리는 안 들렸어?</div><div class="chat-input">메시지 보내기 <span aria-hidden="true">➤</span></div></div>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="./review.ts"></script>
</body>
</html>
