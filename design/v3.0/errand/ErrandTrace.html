<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>심부름·목격 기록·밤 흔적 시안</title>
<style>
:root{--n950:#0a0e1c;--n700:#1e2847;--n600:#2a3760;--g50:#f1f2f5;--g300:#a9aebb;--b200:#e8d3a8;--b400:#c9a46a;--lamp:#ffcf8a;--c400:#e0344b}
*{box-sizing:border-box}body{margin:0;background:var(--n950);color:var(--g50);font:15px/1.5 "Noto Sans KR",system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:28px 20px 60px;display:grid;gap:36px}
h1{font-size:26px;margin:0 0 6px}h2{font-size:18px;margin:0 0 10px;border-left:4px solid var(--b400);padding-left:10px}
p.s{color:var(--g300);margin:0;max-width:70ch}
.row{display:flex;flex-wrap:wrap;gap:24px}
figure{margin:0;width:260px;display:grid;gap:8px}figcaption b{display:block}figcaption span{color:var(--g300);font-size:13px}
.pick{background:var(--b400);color:var(--n950);border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700;width:max-content}
.ph{position:relative;width:260px;height:520px;border-radius:24px;overflow:hidden;background:radial-gradient(120% 70% at 50% 42%,#2a2236,#17141f 55%,#0c0b12);border:1px solid var(--n600)}
.band{position:absolute;top:50px;left:8px;right:8px;height:34px;background:rgba(14,19,38,.9);border-left:3px solid var(--b400);border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:12px}
.band i{margin-left:auto;font-style:normal;color:var(--b200)}
.hd{position:absolute;top:10px;left:10px;right:10px;font-size:13px;font-weight:700;display:flex;justify-content:space-between}
.spot{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--n700);border:2px solid var(--g300);display:grid;place-items:center;font-size:16px}
.spot.next{border-color:var(--lamp);box-shadow:0 0 14px var(--lamp)}.spot.done{border-color:var(--b400);background:var(--b400);color:var(--n950)}
.spot.dim{opacity:.35}
.me{position:absolute;width:20px;height:28px;border-radius:10px 10px 4px 4px;background:var(--b200)}
.oth{position:absolute;width:18px;height:26px;border-radius:9px 9px 4px 4px;background:#7a8bbf}
.ring{position:absolute;border:1px dashed rgba(232,211,168,.45);border-radius:50%}
.dots{position:absolute;left:0;right:0;bottom:84px;display:flex;justify-content:center;gap:8px}
.dots b{width:12px;height:12px;border-radius:50%;border:2px solid var(--b400)}.dots b.on{background:var(--b400)}
.act{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 26px;border-radius:99px;background:var(--b400);color:var(--n950);font-weight:700;font-size:14px}
.card{position:absolute;left:12px;right:12px;background:rgba(14,19,38,.94);border:1px solid var(--n600);border-radius:12px;padding:12px;font-size:13px}
.list{display:grid;gap:6px;margin-top:6px}.list div{display:flex;gap:8px;align-items:center}
.arrow{position:absolute;color:var(--lamp);font-size:18px}
</style></head><body><main>
<header><h1>15페이즈 시안 — 심부름·목격 기록·밤 흔적</h1><p class="s">모든 화면은 글 최소(결정 0051·0073): 장소는 아이콘, 진행은 점 3개, 사회자 띠 한 줄. 각 항목 A 가 추천안이고 UI-SPEC 은 A 를 따른다.</p></header>

<section><h2>1. 심부름 화면 (장소·진행)</h2><div class="row">
<figure><div class="ph"><div class="hd"><span>심부름</span><span>37</span></div><div class="band">🔔 장소 세 곳을 돌아 주세요<i>37</i></div>
<div class="spot done" style="left:40px;top:150px">🍸</div><div class="spot next" style="left:190px;top:210px">🕰</div><div class="spot dim" style="left:70px;top:330px">🎷</div>
<div class="ring" style="left:90px;top:230px;width:110px;height:110px"></div><div class="me" style="left:135px;top:275px"></div><div class="oth" style="left:105px;top:250px"></div>
<div class="arrow" style="left:200px;top:180px">↗</div>
<div class="dots"><b class="on"></b><b></b><b></b></div><div class="act">처리</div></div>
<figcaption><span class="pick">추천 A</span><b>A. 지도 위 장소 아이콘 + 다음 장소 빛남</b><span>다음 장소만 등불빛, 끝낸 곳은 놋쇠로 채움. 반경 점선 안의 사람만 보임. 장소 근처에서 [처리] 단추가 켜진다.</span></figcaption></figure>
<figure><div class="ph"><div class="hd"><span>심부름</span><span>37</span></div><div class="band">🔔 장소 세 곳을 돌아 주세요<i>37</i></div>
<div class="card" style="top:110px"><b>할 일 1/3</b><div class="list"><div>✓ 🍸</div><div>○ 🕰</div><div>○ 🎷</div></div></div>
<div class="me" style="left:120px;top:300px"></div><div class="act">처리</div></div>
<figcaption><b>B. 위쪽 목록 카드</b><span>할 일을 목록으로. 지도를 가려 걷기 방해.</span></figcaption></figure>
</div></section>

<section><h2>2. 목격 기록 (토론 화면)</h2><div class="row">
<figure><div class="ph"><div class="hd"><span>토론</span><span>82</span></div><div class="band">🔔 본 것을 이야기해 주세요<i>82</i></div>
<div class="card" style="top:100px"><b>내가 본 것</b><div class="list"><div>1 🍸 <span class="oth" style="position:static;display:inline-block"></span> 민트</div><div>2 🕰 <span class="oth" style="position:static;display:inline-block;background:#bf7a7a"></span> 라임</div></div></div></div>
<figcaption><span class="pick">추천 A</span><b>A. 접히는 기록 카드(사람·장소·순서)</b><span>3곳 다 한 사람만 보임. 못 마친 사람은 카드 없음. 닫으면 도구 줄 [기록] 이름표로.</span></figcaption></figure>
<figure><div class="ph"><div class="hd"><span>토론</span><span>82</span></div><div class="band">🔔 본 것을 이야기해 주세요<i>82</i></div><div class="card" style="top:100px">채팅으로 자동 입력 <div class="list"><div>"민트를 🍸에서 봤어"</div></div></div></div>
<figcaption><b>B. 채팅에 자동 한 줄</b><span>눈에 띄지만 남이 섞여 읽힘.</span></figcaption></figure>
</div></section>

<section><h2>3. 밤 고르기 + 아침 흔적</h2><div class="row">
<figure><div class="ph"><div class="hd"><span>밤</span><span>24</span></div><div class="band">🔔 한 명을 골라 주세요<i>24</i></div>
<div class="card" style="top:110px"><b>누구를?</b><div class="list"><div>민트</div><div>라임</div><div>체리</div></div></div></div>
<figcaption><span class="pick">추천 A</span><b>A. 모든 역할 같은 이름표 목록</b><span>시민도 똑같이 고름(효과 없음). 단추 이름은 모두 "고르기".</span></figcaption></figure>
<figure><div class="ph"><div class="hd"><span>아침</span><span>5</span></div><div class="band">🔔 현장에 흔적이 남았습니다<i>5</i></div>
<div class="card" style="top:110px;text-align:center"><div style="font-size:34px">🧤</div><b>붉은 장갑 한 짝</b><div style="color:var(--g300);font-size:12px;margin-top:4px">누구의 것인지는 모릅니다</div></div></div>
<figcaption><span class="pick">추천 A</span><b>A. 아침 카드: 아이콘 + 한 줄</b><span>확정 아님을 한 줄로. 피해자 없으면 카드 없음.</span></figcaption></figure>
</div></section>
</main></body></html>
