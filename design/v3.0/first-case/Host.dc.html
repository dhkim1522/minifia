<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>사회자 시안</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&amp;family=Gowun+Dodum&amp;display=swap">
<style>
body{margin:0}
.bars span{display:block;width:4px;border-radius:2px;background:#e8d3a8;animation:bar .32s ease-in-out infinite alternate}
.bars span:nth-child(2){animation-delay:.1s}.bars span:nth-child(3){animation-delay:.2s}.bars span:nth-child(4){animation-delay:.05s}.bars span:nth-child(5){animation-delay:.15s}
@keyframes bar{from{height:4px}to{height:18px}}
.ripple{animation:ripple 1.6s ease-out infinite}
@keyframes ripple{from{transform:scale(.6);opacity:.8}to{transform:scale(1.6);opacity:0}}
</style>
</helmet>
<div style="width: 1314px; height: 964px; box-sizing: border-box; padding: 32px; background: #0a0e1c; color: #f1f2f5; font-family: 'Gowun Dodum', system-ui, sans-serif; display: flex; gap: 40px">

<!-- A 바텐더 사회자 -->
<div style="width: 390px; display: flex; flex-direction: column; gap: 12px">
<div style="height: 44px; display: flex; align-items: center; gap: 8px"><span style="font-size: 24px; font-weight: 700; color: #ffcf8a">A</span><span style="font-size: 16px; font-weight: 700">바텐더 사회자 (추천)</span></div>
<div style="height: 844px; box-sizing: border-box; padding: 24px; border-radius: 20px; background: radial-gradient(90% 50% at 50% 30%, #1e2847, #0e1326 70%); border: 1px solid #c9a46a; display: flex; flex-direction: column; gap: 20px; align-items: center">
<svg width="200" height="340" viewBox="0 0 80 136" role="img" aria-label="바텐더 사회자 전신">
<ellipse cx="40" cy="132" rx="22" ry="4" fill="#000" opacity=".4"></ellipse>
<path d="M18 72 Q18 54 40 54 Q62 54 62 72 L62 124 Q62 130 56 130 L24 130 Q18 130 18 124 Z" fill="#f1e6cf"></path>
<path d="M22 60 L40 98 L58 60 Q62 70 62 80 L62 124 Q62 130 56 130 L24 130 Q18 130 18 124 L18 80 Q18 70 22 60 Z" fill="#8f7048"></path>
<path d="M40 98 L62 80 L62 124 Q62 130 56 130 L40 130 Z" fill="#000" opacity=".15"></path>
<circle cx="40" cy="106" r="1.8" fill="#e8d3a8"></circle><circle cx="40" cy="114" r="1.8" fill="#e8d3a8"></circle><circle cx="40" cy="122" r="1.8" fill="#e8d3a8"></circle>
<path d="M31 56 L40 60 L31 64 Z M49 56 L40 60 L49 64 Z" fill="#c9a46a"></path><circle cx="40" cy="60" r="2" fill="#8f7048"></circle>
<path d="M18 74 Q10 84 12 100 L18 100 Q17 88 22 80 Z" fill="#f1e6cf"></path>
<path d="M62 74 Q72 80 70 94 L64 94 Q64 84 58 80 Z" fill="#f1e6cf"></path>
<circle cx="67" cy="96" r="4.5" fill="#e2c3a0"></circle>
<path d="M62 92 L72 92 L70 104 L64 104 Z" fill="#c9a46a" stroke="#8f7048" stroke-width="1"></path><line x1="67" y1="104" x2="67" y2="108" stroke="#8f7048" stroke-width="1.5"></line>
<circle cx="40" cy="36" r="17" fill="#e2c3a0"></circle>
<ellipse cx="34" cy="30" rx="5" ry="3.5" fill="#fff" opacity=".2"></ellipse>
<circle cx="34" cy="35" r="1.8" fill="#1a1420"></circle><circle cx="46" cy="35" r="1.8" fill="#1a1420"></circle>
<path d="M30 42 Q35 39 40 42 Q45 39 50 42 Q45 45 40 43.5 Q35 45 30 42 Z" fill="#3a2a20"></path>
<path d="M36 47 Q40 49.5 44 47" stroke="#5a2a2a" stroke-width="1.6" fill="none" stroke-linecap="round"></path>
<ellipse cx="40" cy="22" rx="24" ry="5" fill="#1a1420"></ellipse>
<path d="M27 22 Q27 6 40 6 Q53 6 53 22 Z" fill="#221d2e"></path>
<rect x="27" y="17" width="26" height="4" fill="#c9a46a"></rect>
</svg>
<div style="font-size: 14px; color: #a9aebb">페도라 · 조끼 · 나비넥타이 · 놋쇠 종</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; width: 100%">
<sc-for list="{{faces}}" as="f" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="36" fill="#1e2847"></circle><circle cx="36" cy="38" r="17" fill="#e2c3a0"></circle><path d="{{f.eyes}}" fill="{{f.eyeFill}}" stroke="#1a1420" stroke-width="1.8" stroke-linecap="round"></path><path d="{{f.brow}}" stroke="#3a2a20" stroke-width="2" fill="none" stroke-linecap="round"></path><path d="M27 44 Q31.5 41.5 36 44 Q40.5 41.5 45 44 Q40.5 46.5 36 45.5 Q31.5 46.5 27 44 Z" fill="#3a2a20"></path><path d="{{f.mouth}}" fill="{{f.mouthFill}}" stroke="#5a2a2a" stroke-width="1.6" stroke-linecap="round"></path><ellipse cx="36" cy="24" rx="22" ry="4.5" fill="#1a1420"></ellipse><path d="M24 24 Q24 9 36 9 Q48 9 48 24 Z" fill="#221d2e"></path><rect x="24" y="19" width="24" height="3.5" fill="#c9a46a"></rect></svg>
<span style="font-size: 14px; color: #a9aebb">{{f.n}}</span>
</div>
</sc-for>
</div>
<div style="width: 100%; display: flex; gap: 12px; align-items: flex-start">
<svg width="56" height="56" viewBox="0 0 72 72" aria-hidden="true" style="flex: none"><circle cx="36" cy="36" r="36" fill="#1e2847"></circle><circle cx="36" cy="38" r="17" fill="#e2c3a0"></circle><circle cx="30" cy="37" r="1.8" fill="#1a1420"></circle><circle cx="42" cy="37" r="1.8" fill="#1a1420"></circle><path d="M27 44 Q31.5 41.5 36 44 Q40.5 41.5 45 44 Q40.5 46.5 36 45.5 Q31.5 46.5 27 44 Z" fill="#3a2a20"></path><ellipse cx="36" cy="49" rx="3" ry="2.2" fill="#5a2a2a"></ellipse><ellipse cx="36" cy="24" rx="22" ry="4.5" fill="#1a1420"></ellipse><path d="M24 24 Q24 9 36 9 Q48 9 48 24 Z" fill="#221d2e"></path><rect x="24" y="19" width="24" height="3.5" fill="#c9a46a"></rect></svg>
<div style="flex: 1; padding: 12px 16px; border-radius: 16px; background: #151c36; border: 1px solid #2a3760">
<div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #e8d3a8">사회자<span class="bars" style="display: flex; align-items: center; gap: 2px; height: 18px"><span></span><span></span><span></span><span></span><span></span></span></div>
<div style="margin-top: 4px; font-size: 24px; font-weight: 700; line-height: 1.3">이 중에 마피아가 있습니다</div>
</div>
</div>
<div style="font-size: 14px; color: #a9aebb; line-height: 1.5; text-align: center">말할 때 입이 움직이고 웅얼 목소리가 난다<br>본게임 사회자 띠(14페이즈)에도 같은 얼굴을 쓸 수 있다</div>
</div>
</div>

<!-- B 시계탑 확성기 -->
<div style="width: 390px; display: flex; flex-direction: column; gap: 12px">
<div style="height: 44px; display: flex; align-items: center; gap: 8px"><span style="font-size: 24px; font-weight: 700; color: #a9aebb">B</span><span style="font-size: 16px; font-weight: 700">시계탑 확성기</span></div>
<div style="height: 844px; box-sizing: border-box; padding: 24px; border-radius: 20px; background: radial-gradient(90% 50% at 50% 30%, #1e2847, #0e1326 70%); border: 1px solid #2a3760; display: flex; flex-direction: column; gap: 24px; align-items: center">
<div style="position: relative; width: 240px; height: 300px; display: grid; place-items: center">
<div class="ripple" style="position: absolute; left: 150px; top: 40px; width: 80px; height: 80px; border-radius: 50%; border: 2px solid #e8d3a8"></div>
<svg width="220" height="300" viewBox="0 0 88 120" role="img" aria-label="시계탑 확성기">
<rect x="40" y="40" width="8" height="78" fill="#3b4250"></rect>
<path d="M30 118 L58 118 L54 110 L34 110 Z" fill="#2a3760"></path>
<circle cx="44" cy="34" r="14" fill="#151c36" stroke="#8f7048" stroke-width="2"></circle>
<circle cx="44" cy="34" r="6" fill="#ffcf8a"></circle>
<path d="M54 26 L80 12 L80 52 L54 40 Z" fill="#c9a46a" stroke="#8f7048" stroke-width="1.5"></path>
<ellipse cx="80" cy="32" rx="4" ry="20" fill="#8f7048"></ellipse>
</svg>
</div>
<div style="display: flex; gap: 16px">
<sc-for list="{{bStates}}" as="b" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 56px; height: 56px; border-radius: 50%; background: #151c36; border: 2px solid {{b.c}}; box-shadow: 0 0 16px {{b.g}}; display: grid; place-items: center"><span style="width: 18px; height: 18px; border-radius: 50%; background: {{b.c}}"></span></span><span style="font-size: 14px; color: #a9aebb">{{b.n}}</span></div>
</sc-for>
</div>
<div style="width: 100%; padding: 12px 16px; box-sizing: border-box; border-radius: 16px; background: #151c36; border: 1px solid #2a3760; font-size: 24px; font-weight: 700; line-height: 1.3">이 중에 마피아가 있습니다</div>
<div style="font-size: 14px; color: #a9aebb; line-height: 1.5; text-align: center">얼굴 대신 램프 눈의 색과 링으로 감정을 낸다<br>신비롭지만 정이 덜 간다</div>
</div>
</div>

<!-- C 목소리만 -->
<div style="width: 390px; display: flex; flex-direction: column; gap: 12px">
<div style="height: 44px; display: flex; align-items: center; gap: 8px"><span style="font-size: 24px; font-weight: 700; color: #a9aebb">C</span><span style="font-size: 16px; font-weight: 700">목소리 파형 + 자막 띠</span></div>
<div style="height: 844px; box-sizing: border-box; padding: 24px; border-radius: 20px; background: radial-gradient(90% 50% at 50% 30%, #1e2847, #0e1326 70%); border: 1px solid #2a3760; display: flex; flex-direction: column; gap: 24px; justify-content: center">
<div style="height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 12px; background: rgba(14,19,38,.92); border: 1px solid #2a3760">
<span class="bars" style="display: flex; align-items: center; gap: 3px; height: 24px"><span></span><span></span><span></span><span></span><span></span></span>
<span style="font-size: 16px; font-weight: 700">이 중에 마피아가 있습니다</span>
</div>
<div style="font-size: 14px; color: #a9aebb; line-height: 1.5; text-align: center">본게임 자막 띠(14페이즈)와 같은 모양<br>가볍지만 처음 온 사람을 붙잡는 힘이 약하다</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1314,"height":964}}'>

  renderVals() {
    return {
      faces: [
        { n: '평온', eyes: 'M29 37.5a1.8 1.8 0 103.6 0 1.8 1.8 0 10-3.6 0 M39.4 37.5a1.8 1.8 0 103.6 0 1.8 1.8 0 10-3.6 0', eyeFill: '#1a1420', brow: 'M27 31 Q30 29.5 33 31 M39 31 Q42 29.5 45 31', mouth: 'M32 49 Q36 51.5 40 49', mouthFill: 'none' },
        { n: '놀람', eyes: 'M27.5 37a3 3 0 106 0 3 3 0 10-6 0 M38.5 37a3 3 0 106 0 3 3 0 10-6 0', eyeFill: '#f1f2f5', brow: 'M27 29 Q30 26.5 33 28.5 M39 28.5 Q42 26.5 45 29', mouth: 'M33.5 50a2.5 3 0 105 0 2.5 3 0 10-5 0', mouthFill: '#5a2a2a' },
        { n: '의심', eyes: 'M28 37.5 H33 M39 37.5 H44', eyeFill: 'none', brow: 'M27 33 Q30 31 33 32.5 M39 31 Q42 30 45 29.5', mouth: 'M32 50 H40', mouthFill: 'none' },
        { n: '축하', eyes: 'M28 38 Q30.5 35 33 38 M39 38 Q41.5 35 44 38', eyeFill: 'none', brow: 'M27 30.5 Q30 29 33 30.5 M39 30.5 Q42 29 45 30.5', mouth: 'M31 48.5 Q36 54 41 48.5 Z', mouthFill: '#5a2a2a' }
      ],
      bStates: [
        { n: '말하기', c: '#e8d3a8', g: 'rgba(232,211,168,.4)' },
        { n: '긴장', c: '#e0344b', g: 'rgba(224,52,75,.45)' },
        { n: '축하', c: '#ffcf8a', g: 'rgba(255,207,138,.55)' }
      ]
    };
  }
}
</script>
</body>
</html>
