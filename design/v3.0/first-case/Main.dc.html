<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>첫 사건 프로토타입</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&amp;family=Gowun+Dodum&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
.lamp .glow{transition:opacity .4s}
.lamp.off .glow{opacity:0}
.lamp.off .bulb{fill:#3a3f4b}
.lamp.seq .glow{animation:lampOff .35s ease-out forwards}
.lamp.seq .bulb{animation:bulbOff .35s forwards}
.lamp.seq.d1 .glow,.lamp.seq.d1 .bulb{animation-delay:.7s}
.lamp.seq.d2 .glow,.lamp.seq.d2 .bulb{animation-delay:1.2s}
.lamp.seq.d3 .glow,.lamp.seq.d3 .bulb{animation-delay:1.7s}
.lamp.seq.d4 .glow,.lamp.seq.d4 .bulb{animation-delay:2.2s}
@keyframes lampOff{to{opacity:0}}
@keyframes bulbOff{to{fill:#3a3f4b}}
.flash{animation:flash 1.4s ease-out 2.6s both}
@keyframes flash{0%{opacity:0}12%{opacity:.55}100%{opacity:0}}
.ring{animation:ring 1.3s ease-out both}
.ring.r1{animation-delay:2.6s}.ring.r2{animation-delay:2.85s}.ring.r3{animation-delay:3.1s}
@keyframes ring{0%{transform:scale(.2);opacity:0}10%{opacity:.9}100%{transform:scale(3.2);opacity:0}}
.vanish{animation:vanish .5s ease-in 2.7s both}
@keyframes vanish{to{opacity:0;transform:translateY(6px) scale(.9)}}
.fadeup{animation:fadeup .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.d03{animation-delay:.3s}.d06{animation-delay:.6s}.d09{animation-delay:.9s}.d12{animation-delay:1.2s}.d16{animation-delay:1.6s}
.pop{animation:pop .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.reveal{animation:reveal 1.1s steps(14) both}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.walk{animation:walk 1.6s cubic-bezier(.3,.6,.4,1) both}
@keyframes walk{from{transform:translateX(240px)}to{transform:none}}
.callpulse{animation:callpulse 1.1s ease-in-out 5}
@keyframes callpulse{0%,100%{box-shadow:0 0 0 3px #ffcf8a,0 0 18px 4px rgba(255,207,138,.35)}50%{box-shadow:0 0 0 3px #ffcf8a,0 0 32px 12px rgba(255,207,138,.6)}}
.stamp{animation:stamp .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-16deg)}100%{opacity:1;transform:scale(1) rotate(-8deg)}}
.flip{animation:flip .6s cubic-bezier(.2,.8,.2,1) both}
.f1{animation-delay:.1s}.f2{animation-delay:.45s}.f3{animation-delay:.8s}.f4{animation-delay:1.15s}
@keyframes flip{0%{transform:perspective(700px) rotateY(90deg);opacity:.2}100%{transform:perspective(700px) rotateY(0);opacity:1}}
.spark{animation:spark .9s ease-out .55s both}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.draw{stroke-dasharray:420;animation:draw 1s ease-out both}
.draw.l2{animation-delay:.9s}.draw.l1{animation-delay:.4s}
@keyframes draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.talk .mouth{animation:mouth .16s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes mouth{from{transform:scaleY(.3)}to{transform:scaleY(1.3)}}
.bars span{display:block;width:3px;border-radius:2px;background:#e8d3a8;height:4px}
.talk .bars span{animation:bar .3s ease-in-out infinite alternate}
.talk .bars span:nth-child(2){animation-delay:.1s}.talk .bars span:nth-child(3){animation-delay:.2s}.talk .bars span:nth-child(4){animation-delay:.05s}
@keyframes bar{from{height:4px}to{height:14px}}
.veil{animation:veil .45s both}
@keyframes veil{from{opacity:0}}
.finger{animation:finger .7s ease-in-out infinite alternate}
@keyframes finger{from{translate:0 0}to{translate:-8px -8px}}
.nextpulse{animation:nextpulse 1.6s ease-in-out infinite}
@keyframes nextpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,207,138,.5)}50%{box-shadow:0 0 0 10px rgba(255,207,138,0)}}
.tracering{animation:tracering 1.1s ease-in-out 4}
@keyframes tracering{50%{box-shadow:0 0 0 2px #d23c4e,0 0 18px 6px rgba(210,60,78,.55)}}
.cardglow{animation:cardglow 2.4s ease-in-out infinite}
@keyframes cardglow{0%,100%{box-shadow:0 0 0 1px #c9a46a,0 0 18px rgba(255,207,138,.18)}50%{box-shadow:0 0 0 1px #c9a46a,0 0 34px rgba(255,207,138,.4)}}
.still *{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</helmet>
<div class="{{rootCls}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: {{bg}}; color: #f1f2f5; font-family: 'Gowun Dodum', system-ui, sans-serif; word-break: keep-all; transition: background .8s">

<!-- 무대: 시계탑 광장 -->
<svg width="390" height="520" viewBox="0 0 390 520" aria-hidden="true" style="position: absolute; left: 0; top: 120px; opacity: {{stageOp}}; transition: opacity .8s">
<defs><radialGradient id="lg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffcf8a" stop-opacity=".85"></stop><stop offset="1" stop-color="#ffcf8a" stop-opacity="0"></stop></radialGradient></defs>
<polygon points="195,70 385,250 195,430 5,250" fill="{{ground}}" stroke="#2a3760" stroke-width="2"></polygon>
<polygon points="195,112 340,250 195,388 50,250" fill="none" stroke="#2a3760" stroke-width="1" stroke-dasharray="4 6"></polygon>
<rect x="178" y="-14" width="34" height="108" fill="#1e2847" stroke="#2a3760"></rect>
<path d="M172 -14 L195 -44 L218 -14 Z" fill="#151c36"></path>
<circle cx="195" cy="20" r="11" fill="#e8d3a8" opacity=".85"></circle>
<path d="M195 20 V12 M195 20 L201 23" stroke="#151c36" stroke-width="2" stroke-linecap="round"></path>
<ellipse cx="195" cy="250" rx="36" ry="18" fill="#2a3760"></ellipse>
<ellipse cx="195" cy="246" rx="27" ry="12" fill="#3b5a86" opacity=".7"></ellipse>
<g class="lamp {{lampMode}} d1"><circle class="glow" cx="60" cy="196" r="46" fill="url(#lg)"></circle><line x1="60" y1="250" x2="60" y2="202" stroke="#8f7048" stroke-width="3"></line><circle class="bulb" cx="60" cy="198" r="5" fill="#ffcf8a"></circle></g>
<g class="lamp {{lampMode}} d2"><circle class="glow" cx="330" cy="196" r="46" fill="url(#lg)"></circle><line x1="330" y1="250" x2="330" y2="202" stroke="#8f7048" stroke-width="3"></line><circle class="bulb" cx="330" cy="198" r="5" fill="#ffcf8a"></circle></g>
<g class="lamp {{lampMode}} d3"><circle class="glow" cx="120" cy="96" r="40" fill="url(#lg)"></circle><line x1="120" y1="142" x2="120" y2="102" stroke="#8f7048" stroke-width="3"></line><circle class="bulb" cx="120" cy="98" r="5" fill="#ffcf8a"></circle></g>
<g class="lamp {{lampMode}} d4"><circle class="glow" cx="270" cy="96" r="40" fill="url(#lg)"></circle><line x1="270" y1="142" x2="270" y2="102" stroke="#8f7048" stroke-width="3"></line><circle class="bulb" cx="270" cy="98" r="5" fill="#ffcf8a"></circle></g>
</svg>

<!-- 심부름 장소 타일 -->
<sc-if value="{{showTiles}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 160px; top: 262px; width: 64px; height: 64px; border-radius: 16px; background: #151c36; display: grid; place-items: center; box-shadow: 0 0 0 2px #e8d3a8, 0 0 14px 2px rgba(232,211,168,.35)">
<svg width="44" height="44" viewBox="0 0 48 48" role="img" aria-label="분수" stroke="#1a1420" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M24 22c-6-8-12-8-14-4M24 22c6-8 12-8 14-4" fill="none" stroke="#5ab4e6" stroke-width="3"></path><path d="M24 8v14" stroke="#5ab4e6" stroke-width="3"></path><circle cx="24" cy="7" r="2.5" fill="#bfe6fb"></circle><path d="M6 30h36l-4 10H10z" fill="#b9c2cf"></path><path d="M8 30c4 3 8 3 12 0 4 3 8 3 12 0 4 3 6 3 8 0" fill="#7fc8ef"></path></svg>
</div>
<div style="position: absolute; left: 282px; top: 430px; width: 64px; height: 64px; border-radius: 16px; background: #151c36; display: grid; place-items: center; box-shadow: {{postRing}}; opacity: {{postOp}}; transition: opacity .3s">
<svg width="44" height="44" viewBox="0 0 48 48" role="img" aria-label="우체통" stroke="#1a1420" stroke-width="2" stroke-linejoin="round"><path d="M12 18a12 12 0 0124 0v22H12z" fill="#d8443c"></path><rect x="16" y="20" width="16" height="4" rx="1" fill="#1a1420"></rect><path d="M14 40h20v4H14z" fill="#8a2a26"></path></svg>
<sc-if value="{{postDone}}" hint-placeholder-val="{{false}}">
<div class="pop" style="position: absolute; right: -6px; bottom: -6px; width: 24px; height: 24px; border-radius: 50%; background: #c9a46a; display: grid; place-items: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0a0e1c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></div>
</sc-if>
</div>
</sc-if>

<!-- 아침의 빈자리 -->
<sc-if value="{{showEmpty}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 146px; top: 382px; width: 64px; height: 26px; border-radius: 50%; border: 2px dashed rgba(232,211,168,.55)"></div>
<svg width="40" height="20" viewBox="0 0 40 20" aria-hidden="true" style="position: absolute; left: 158px; top: 384px; transform: rotate(-14deg)"><ellipse cx="20" cy="14" rx="18" ry="4" fill="#1a1420"></ellipse><path d="M10 14 Q10 2 20 2 Q30 2 30 14 Z" fill="#2b2633"></path><rect x="10" y="10" width="20" height="3" fill="#8f7048"></rect></svg>
</sc-if>

<!-- 사람들 -->
<sc-for list="{{people}}" as="p" hint-placeholder-count="4">
<div class="{{p.cls}}" style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: 56px; display: flex; flex-direction: column; align-items: center; opacity: {{p.op}}; transition: opacity .6s">
<svg width="44" height="76" viewBox="0 0 40 70" aria-hidden="true">
<ellipse cx="20" cy="66" rx="13" ry="3.5" fill="#000" opacity=".35"></ellipse>
<path d="M8 40 Q8 30 20 30 Q32 30 32 40 L32 62 Q32 65 28 65 L12 65 Q8 65 8 62 Z" fill="{{p.coat}}"></path>
<path d="M20 30 Q32 30 32 40 L32 62 Q32 65 28 65 L20 65 Z" fill="#000" opacity=".18"></path>
<rect x="10" y="32" width="20" height="5" rx="2.5" fill="{{p.scarf}}"></rect>
<circle cx="20" cy="20" r="11" fill="{{p.skin}}"></circle>
<path d="M9 20 Q9 8 20 8 Q31 8 31 20 Q26 13 20 13 Q14 13 9 20 Z" fill="{{p.hair}}"></path>
<ellipse cx="20" cy="11.5" rx="15" ry="3.2" fill="{{p.hat}}"></ellipse>
<path d="M12 11.5 Q12 2 20 2 Q28 2 28 11.5 Z" fill="{{p.hat}}"></path>
<ellipse cx="16" cy="16" rx="3.5" ry="2.5" fill="#fff" opacity=".18"></ellipse>
<circle cx="16.5" cy="21" r="1.4" fill="#1a1420"></circle>
<circle cx="23.5" cy="21" r="1.4" fill="#1a1420"></circle>
</svg>
<div class="{{p.tagCls}}" style="margin-top: 2px; display: {{p.tagDisp}}; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 999px; background: rgba(14,19,38,0.8); box-shadow: {{p.tagRing}}; font-size: 14px; font-weight: 700; white-space: nowrap">
<span style="width: 6px; height: 6px; border-radius: 50%; background: {{p.dot}}"></span>{{p.name}}
<sc-if value="{{p.mark}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f08a97" stroke-width="2.4" stroke-linecap="round" role="img" aria-label="같은 옷"><path d="M3 15c3-7 5 4 8-3s5 3 8-4"></path></svg></sc-if>
<sc-if value="{{p.seen}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e8d3a8" stroke-width="2" role="img" aria-label="마지막 목격"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"></path><circle cx="12" cy="12" r="2.6"></circle></svg></sc-if>
</div>
</div>
</sc-for>

<!-- 1 오프닝 -->
<sc-if value="{{s1}}" hint-placeholder-val="{{false}}">
<div class="flash" style="position: absolute; inset: 0; background: radial-gradient(60% 45% at 50% 48%, rgba(200,16,46,.75), rgba(200,16,46,0)); pointer-events: none"></div>
<div style="position: absolute; left: 178px; top: 372px; width: 0; height: 0">
<div class="ring r1" style="position: absolute; left: -30px; top: -30px; width: 60px; height: 60px; border-radius: 50%; border: 2px solid #f2556a"></div>
<div class="ring r2" style="position: absolute; left: -30px; top: -30px; width: 60px; height: 60px; border-radius: 50%; border: 2px solid #f2556a"></div>
<div class="ring r3" style="position: absolute; left: -30px; top: -30px; width: 60px; height: 60px; border-radius: 50%; border: 2px solid #f2556a"></div>
</div>
<div class="fadeup d03" style="position: absolute; left: 0; right: 0; top: 112px; text-align: center; font-family: 'Gowun Batang', serif; font-size: 36px; font-weight: 700; color: #c9d4ff; text-shadow: 0 2px 12px rgba(0,0,0,.6)">밤이 되었습니다</div>
</sc-if>

<!-- 2 아침, 사회자 -->
<sc-if value="{{s2}}" hint-placeholder-val="{{false}}">
<sc-if value="{{tension}}" hint-placeholder-val="{{false}}"><div class="veil" style="position: absolute; inset: 0; background: radial-gradient(80% 60% at 50% 45%, rgba(200,16,46,0), rgba(200,16,46,.16)); pointer-events: none"></div></sc-if>
<div class="fadeup" style="position: absolute; left: 0; right: 0; top: 96px; text-align: center; font-size: 24px; font-weight: 700; color: #e6e8ee">아침</div>
</sc-if>

<!-- 포커스 조명(흐림 + 어둠 + 램프 링) -->
<sc-if value="{{hasHole}}" hint-placeholder-val="{{false}}">
<sc-for list="{{veils}}" as="v" hint-placeholder-count="4"><div class="veil" style="{{v.st}}"></div></sc-for>
<div class="callpulse" style="{{ringSt}}"></div>
<sc-if value="{{hasFinger}}" hint-placeholder-val="{{false}}"><div style="{{fingerSt}}"><svg class="finger" width="48" height="48" viewBox="0 0 24 24" fill="#ffcf8a" stroke="#0a0e1c" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true" style="transform: rotate(-30deg)"><path d="M8 13V5.5a1.5 1.5 0 013 0V11l5 .8a2 2 0 011.6 2.3l-.9 4.9a2 2 0 01-2 1.6H11a3 3 0 01-2.4-1.2L5.5 15a1.6 1.6 0 012.5-2z"></path></svg></div></sc-if>
</sc-if>

<!-- 2 사회자 말풍선 -->
<sc-if value="{{s2}}" hint-placeholder-val="{{false}}">
<div class="{{hostCls}}" style="position: absolute; left: 16px; right: 16px; top: 616px; display: flex; gap: 12px; align-items: flex-start">
<svg width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="사회자" style="flex: none">
<circle cx="36" cy="36" r="36" fill="#1e2847"></circle>
<path d="M12 72 Q12 48 36 48 Q60 48 60 72 Z" fill="#2b2633"></path>
<path d="M26 50 L36 72 L46 50 Q36 47 26 50 Z" fill="#8f7048"></path>
<circle cx="36" cy="60" r="1.6" fill="#e8d3a8"></circle><circle cx="36" cy="66" r="1.6" fill="#e8d3a8"></circle>
<path d="M29 49 L36 52 L29 55 Z M43 49 L36 52 L43 55 Z" fill="#c9a46a"></path>
<circle cx="36" cy="32" r="14" fill="#e2c3a0"></circle>
<ellipse cx="31" cy="27" rx="4" ry="3" fill="#fff" opacity=".2"></ellipse>
<circle cx="31" cy="31" r="1.6" fill="#1a1420"></circle><circle cx="41" cy="31" r="1.6" fill="#1a1420"></circle>
<path d="M28 37 Q32 35 36 37 Q40 35 44 37 Q40 39 36 38 Q32 39 28 37 Z" fill="#3a2a20"></path>
<ellipse class="mouth" cx="36" cy="41" rx="3" ry="1.6" fill="#5a2a2a"></ellipse>
<ellipse cx="36" cy="21" rx="20" ry="4" fill="#1a1420"></ellipse>
<path d="M25 21 Q25 8 36 8 Q47 8 47 21 Z" fill="#221d2e"></path>
<rect x="25" y="17" width="22" height="3" fill="#c9a46a"></rect>
</svg>
<div style="flex: 1; min-height: 96px; box-sizing: border-box; padding: 12px 16px; border-radius: 16px; background: #151c36; border: 1px solid #2a3760">
<div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #e8d3a8">사회자<span class="bars" style="display: flex; align-items: center; gap: 2px; height: 14px"><span></span><span></span><span></span><span></span></span></div>
<div class="reveal" style="margin-top: 4px; font-size: 24px; font-weight: 700; line-height: 1.3; color: #f1f2f5">{{hostLine}}</div>
</div>
</div>
</sc-if>

<!-- 3 심부름: [처리] 와 말풍선 -->
<sc-if value="{{s3}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="position: absolute; left: 196px; top: 448px; width: 40px; height: 40px; transform: rotate(-28deg)"><svg width="40" height="40" viewBox="0 0 24 24" fill="#ffcf8a" stroke="#0a0e1c" stroke-width="1"><path d="M4 12h12l-4-5 2-1 7 7-7 7-2-1 4-5H4z"></path></svg></div>
<div class="pop d06" style="position: absolute; left: 70px; top: 290px; width: 236px; box-sizing: border-box; padding: 12px 16px; border-radius: 16px; background: #1e2847; border: 1px solid #ffcf8a; font-size: 16px; font-weight: 700">우체통에서 처리하세요</div>
<button type="button" class="pop d09" onClick="{{doErrand}}" style="position: absolute; left: 274px; top: 380px; height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 6px; border: none; border-radius: 999px; background: #c9a46a; color: #0a0e1c; font-size: 16px; font-weight: 700; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a0e1c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 013 0V11l5 .8a2 2 0 011.6 2.3l-.9 4.9a2 2 0 01-2 1.6H11a3 3 0 01-2.4-1.2L5.5 15a1.6 1.6 0 012.5-2z"></path></svg>처리</button>
<div role="img" aria-label="진행 0/1" style="position: absolute; left: 0; right: 0; bottom: 40px; display: flex; justify-content: center; gap: 12px"><span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 3px solid #c9a46a; background: {{dotFill}}"></span></div>
</sc-if>

<!-- 4 목격 -->
<sc-if value="{{s4}}" hint-placeholder-val="{{false}}">
<sc-if value="{{seen}}" hint-placeholder-val="{{true}}">
<div class="pop" style="position: absolute; left: 146px; top: 300px; width: 36px; height: 36px; border-radius: 50%; background: #1e2847; border: 2px solid #e8d3a8; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e8d3a8" stroke-width="2" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"></path><circle cx="12" cy="12" r="2.6"></circle></svg></div>
<div class="pop d03" style="position: absolute; left: 96px; top: 210px; width: 262px; box-sizing: border-box; padding: 12px 16px; border-radius: 16px; background: #1e2847; border: 1px solid #ffcf8a; font-size: 16px; font-weight: 700">가는 길에 본 사람은 기록돼요</div>
<div class="fadeup d06" style="position: absolute; left: 16px; right: 16px; top: 640px; box-sizing: border-box; padding: 12px 16px; border-radius: 16px; background: rgba(14,19,38,.92); border: 1px solid #2a3760">
<div style="font-size: 14px; color: #a9aebb">목격 기록</div>
<div style="margin-top: 8px; height: 44px; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e8d3a8" stroke-width="2" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"></path><circle cx="12" cy="12" r="2.6"></circle></svg>
<span style="width: 8px; height: 8px; border-radius: 50%; background: #8e7ab8"></span>도윤
<span style="margin-left: auto; width: 40px; height: 40px; border-radius: 12px; background: #151c36; display: grid; place-items: center"><svg width="30" height="30" viewBox="0 0 48 48" role="img" aria-label="가로등" stroke="#1a1420" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M22 14h4v28h-4z" fill="#59616e"></path><path d="M14 14h20l-4-8H18z" fill="#3b4250"></path><circle cx="24" cy="17" r="4" fill="#ffd36b"></circle><path d="M16 42h16" stroke-width="3"></path></svg></span>
</div>
</div>
</sc-if>

    if (name === 'scream') { this.tone(0, 1250, 520, 0.7, 'sawtooth', 0.05); this.tone(0, 1310, 540, 0.7, 'sine', 0.08); this.noise(0, 0.5, 1800, 0.8, 0.12); this.tone(0.1, 73, 55, 1.4, 'sine', 0.4); }
    if (name === 'sting') { [146.8, 174.6, 207.7].forEach((f, i) => this.tone(0.02 * i, f, f * 0.97, 1.3, 'sawtooth', 0.035)); this.tone(0, 55, 50, 1.4, 'sine', 0.3); }
    if (name === 'whoosh') this.noise(0, 0.32, 1400, 0.6, 0.16);
    if (name === 'tap') { this.tone(0, 660, 640, 0.08, 'triangle', 0.18); this.tone(0.07, 990, 980, 0.12, 'triangle', 0.14); }
    if (name === 'step') [0, 0.32, 0.64, 0.96, 1.28].forEach((t) => this.noise(t, 0.05, 400, 2, 0.1));
    if (name === 'eye') { this.tone(0, 880, 1320, 0.18, 'sine', 0.12); this.tone(0.12, 1320, 1318, 0.25, 'sine', 0.08); }
    if (name === 'link') [0, 0.5].forEach((t) => this.tone(t + 0.4, 520, 780, 0.35, 'triangle', 0.1));
    if (name === 'buzz') this.tone(0, 140, 110, 0.25, 'square', 0.06);
    if (name === 'stamp') { this.noise(0, 0.09, 300, 0.7, 0.35); this.tone(0, 90, 50, 0.22, 'sine', 0.45); }
    if (name === 'fanfare') [293.7, 349.2, 440, 523.3, 659.3].forEach((f, i) => { this.tone(0.11 * i, f, f, 0.5, 'triangle', 0.12); this.tone(0.11 * i, f * 2, f * 2, 0.3, 'sine', 0.03); });
    if (name === 'flip') [0.1, 0.45, 0.8, 1.15].forEach((t) => { this.noise(t, 0.09, 2400, 1.5, 0.12); this.tone(t + 0.05, 440, 520, 0.12, 'triangle', 0.06); });
    if (name === 'warm') [146.8, 220, 277.2, 329.6].forEach((f, i) => this.tone(0.05 * i, f, f, 1.6, 'sine', 0.06));
  }
  enter(s) {
    if (s === 1) { [0.7, 1.2, 1.7, 2.2].forEach((t) => this.later(() => this.sfx('lamp'), t * 1000)); this.later(() => this.sfx('scream'), 2600); this.later(() => this.go(2), 4400); }
    if (s === 2) { this.sfx('whoosh'); this.say('서연 님이 사라졌습니다'); this.later(() => { this.setState({ line: 1 }); this.sfx('sting'); this.say('이 중에 마피아가 있습니다'); }, 2600); }
    if (s === 3) { this.sfx('whoosh'); this.later(() => this.say('우체통에서 처리하세요'), 500); }
    if (s === 4) { this.sfx('step'); this.later(() => { this.setState({ seen: true }); this.sfx('eye'); this.sfx('whoosh'); this.later(() => this.say('가는 길에 본 사람은 기록돼요'), 350); }, 1700); }
    if (s === 5) { this.sfx('link'); this.later(() => this.say('본 것과 흔적을 이어 보세요'), 1300); }
    if (s === 6) { this.sfx('whoosh'); this.say('의심되는 사람을 누르세요'); }
    if (s === 7) { this.sfx('flip'); this.later(() => this.say('밤에는 저마다 할 일이 있어요'), 1500); }
    if (s === 8) this.sfx('warm');
  }
  pick(name) {
    if (this.state.voted) return;
    if (name !== '도윤') {
      this.sfx('buzz'); this.say('흔적을 떠올려 보세요');
      this.setState({ wrong: true, wrongKey: this.state.wrongKey + 1 });
      return;
    }
    this.sfx('stamp');
    this.setState({ voted: true, wrong: false });
    this.later(() => { this.setState({ revealed: true }); this.sfx('fanfare'); }, 900);
  }
  person(name, x, y, o) {
    const base = {
      '민준': { coat: '#3d4a6b', scarf: '#3d4a6b', hat: 'transparent', hair: '#4a3020', skin: '#e2c3a0', dot: '#7a8fb8' },
      '도윤': { coat: '#2b2b33', scarf: '#d23c4e', hat: '#1a1420', hair: '#2a1d18', skin: '#e2c3a0', dot: '#8e7ab8' },
      '지호': { coat: '#6b5a43', scarf: '#6b5a43', hat: 'transparent', hair: '#c9a46a', skin: '#ecd0b0', dot: '#6fa59a' },
      '나': { coat: '#3c5aa8', scarf: '#e8d3a8', hat: '#5a4030', hair: '#3a2a20', skin: '#e2c3a0', dot: '#b89a6f' },
      '서연': { coat: '#4b5d52', scarf: '#4b5d52', hat: '#2b2633', hair: '#2a1d18', skin: '#ecd0b0', dot: '#6fa59a' }
    }[name];
    return Object.assign({ name: name, x: x, y: y, op: 1, cls: '', tagCls: '', tagDisp: 'flex', tagRing: name === '나' ? '0 0 0 1.5px #e6e8ee' : 'none', mark: false, seen: false }, base, o || {});
  }
  hole(x, y, w, h) {
    const f = this.props.focus ?? 'A';
    const box = 'left: ' + x + 'px; top: ' + y + 'px; width: ' + w + 'px; height: ' + h + 'px;';
    const four = (v) => [
      { st: v + ' left: 0; top: 0; width: 390px; height: ' + y + 'px' },
      { st: v + ' left: 0; top: ' + (y + h) + 'px; width: 390px; height: ' + (844 - y - h) + 'px' },
      { st: v + ' left: 0; top: ' + y + 'px; width: ' + x + 'px; height: ' + h + 'px' },
      { st: v + ' left: ' + (x + w) + 'px; top: ' + y + 'px; width: ' + (390 - x - w) + 'px; height: ' + h + 'px' }
    ];
    if (f === 'B') {
      const cx = x + w / 2;
      return {
        veils: four('position: absolute; background: rgba(5,7,14,.86); z-index: 2;').concat([
          { st: 'position: absolute; left: 0; top: 0; width: 390px; height: ' + (y + h) + 'px; z-index: 2; pointer-events: none; background: linear-gradient(180deg, rgba(255,230,196,.22), rgba(255,230,196,.05)); clip-path: polygon(' + (cx - 14) + 'px 0, ' + (cx + 14) + 'px 0, ' + (x + w + 10) + 'px 100%, ' + (x - 10) + 'px 100%)' },
          { st: 'position: absolute; left: ' + (x - 16) + 'px; top: ' + (y + h - 18) + 'px; width: ' + (w + 32) + 'px; height: 36px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,230,196,.45), rgba(255,230,196,0)); z-index: 2; pointer-events: none' }
        ]),
        ringSt: 'display: none'
      };
    }
    if (f === 'C') {
      return {
        veils: [],
        ringSt: 'position: absolute; ' + box + ' border-radius: 16px; pointer-events: none; z-index: 2; border: 2px dashed rgba(255,207,138,.7)',
        fingerSt: 'position: absolute; left: ' + (x + w - 18) + 'px; top: ' + (y + h - 20) + 'px; width: 48px; height: 48px; z-index: 3; pointer-events: none'
      };
    }
    return {
      veils: four('position: absolute; background: rgba(10,14,28,.62); backdrop-filter: blur(3px); z-index: 2;'),
      ringSt: 'position: absolute; ' + box + ' border-radius: 16px; pointer-events: none; z-index: 2'
    };
  }
  renderVals() {
    const st = this.state; const s = st.s;
    const night = 'radial-gradient(120% 70% at 50% 40%, #1a2140, #0e1326 55%, #0a0e1c)';
    const day = 'radial-gradient(120% 70% at 50% 35%, #4a4756, #262a3a 55%, #141826)';
    const bg = (s === 1 || s === 0 || s === 8 || s === 7) ? night : day;
    let people = [];
    if (s === 0 || s === 8) people = [this.person('민준', 60, 300, { op: 0.6 }), this.person('도윤', 262, 280, { op: 0.6 }), this.person('지호', 226, 420, { op: 0.6 }), this.person('나', 130, 452, { op: 0.6 })];
    if (s === 1) people = [this.person('민준', 60, 300, { tagDisp: 'none' }), this.person('도윤', 262, 280, { tagDisp: 'none' }), this.person('서연', 150, 330, { tagDisp: 'none', cls: 'vanish' }), this.person('지호', 226, 420, { tagDisp: 'none' }), this.person('나', 130, 452, { tagDisp: 'none' })];
    if (s === 2) people = [this.person('민준', 60, 300), this.person('도윤', 262, 280), this.person('지호', 226, 420), this.person('나', 130, 452)];
    if (s === 3) people = [this.person('나', 120, 470)];
    if (s === 4) people = [this.person('나', 228, 500), this.person('도윤', 96, 330, { cls: 'walk' })];
    if (s === 5 || s === 6) people = [this.person('민준', 60, 330, { op: s === 5 ? 0.45 : 1 }), this.person('도윤', 262, 320, { mark: true, seen: true, tagCls: 'tracering', tagRing: '0 0 0 2px #d23c4e' }), this.person('지호', 226, 450, { op: s === 5 ? 0.45 : 1 }), this.person('나', 120, 470, { op: s === 5 ? 0.45 : 1 })];
    let h = null;
    if (s === 2 && st.line === 0) h = this.hole(136, 330, 84, 96);
    if (s === 3 && !st.done) h = this.hole(266, 372, 96, 132);
    if (s === 4 && st.seen) h = this.hole(84, 318, 80, 112);
    if (s === 6 && !st.revealed) h = this.hole(12, 616, 366, 156);
    const voteNames = ['민준', '도윤', '지호'];
    const choices = voteNames.map((n) => { const p = this.person(n, 0, 0); return { name: n, hair: p.hair, hat: p.hat, scarf: p.scarf, dot: p.dot, stamped: st.voted && n === '도윤', pick: () => this.pick(n) }; });
    const roleIcon = {
      eye: 'M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z M12 9.4a2.6 2.6 0 110 5.2 2.6 2.6 0 010-5.2z',
      mask: 'M3 9c3-2 6-2 9 0 3-2 6-2 9 0 0 5-3 8-6 8-1.5 0-2.3-1.5-3-3-.7 1.5-1.5 3-3 3-3 0-6-3-6-8z M8 10.5h1.5 M14.5 10.5H16',
      shield: 'M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z M12 9v6 M9 12h6',
      lens: 'M10.5 4.5a6 6 0 110 12 6 6 0 010-12z M15 15l5.5 5.5'
    };
    const roles = [
      { name: '시민', line: '흔적과 목격으로 마피아를 찾아요', color: '#e8d3a8', edge: '#2a3760', halo: 'rgba(232,211,168,.12)', icon: roleIcon.eye, cls: 'flip f1' },
      { name: '마피아', line: '밤에 한 명을 고르고 들키지 않아요', color: '#f2556a', edge: '#8e0b21', halo: 'rgba(200,16,46,.22)', icon: roleIcon.mask, cls: 'flip f2' },
      { name: '의사', line: '밤에 한 명을 지켜요', color: '#6fa59a', edge: '#2a3760', halo: 'rgba(111,165,154,.18)', icon: roleIcon.shield, cls: 'flip f3' },
      { name: '경찰', line: '밤에 한 명이 마피아인지 알아봐요', color: '#7a8fb8', edge: '#2a3760', halo: 'rgba(122,143,184,.2)', icon: roleIcon.lens, cls: 'flip f4' }
    ];
    const sparks = [];
    for (let i = 0; i < 14; i++) { const a = (i / 14) * Math.PI * 2; const r = 120 + (i % 3) * 30; sparks.push({ dx: Math.round(Math.cos(a) * r), dy: Math.round(Math.sin(a) * r), c: i % 2 ? '#c9a46a' : '#ffcf8a' }); }
    const dots = [1, 2, 3, 4, 5, 6, 7].map((i) => ({ w: i === s ? 20 : 8, c: i < s ? '#c9a46a' : (i === s ? '#ffcf8a' : '#6b7180') }));
    return {
      rootCls: this.props.still ? 'still' : '',
      bg: bg,
      stageOp: s === 7 ? 0 : (s === 0 || s === 8 ? 0.55 : 1),
      ground: (s === 1 || s === 0 || s === 8) ? '#151c36' : '#232b45',
      lampMode: s === 1 ? 'seq' : ((s === 0 || s === 8) ? 'on' : 'off'),
      people: s === 7 ? [] : people,
      s0: s === 0, s1: s === 1, s2: s === 2, s3: s === 3, s4: s === 4, s5: s === 5, s6: s === 6, s7: s === 7, s8: s === 8,
      showTiles: s === 3 || s === 4,
      postDone: st.done,
      postOp: st.done ? 0.55 : 1,
      postRing: st.done ? '0 0 0 3px #c9a46a' : '0 0 0 3px #ffcf8a, 0 0 26px 6px rgba(255,207,138,.45)',
      dotFill: st.done ? '#c9a46a' : 'transparent',
      showEmpty: s === 2,
      tension: s === 2 && st.line === 1,
      hostLine: st.line === 0 ? '서연 님이 사라졌습니다' : '이 중에 마피아가 있습니다',
      hostCls: st.talking ? 'talk' : '',
      seen: st.seen,
      hasHole: !!h,
      veils: h ? h.veils : [],
      ringSt: h ? h.ringSt : '',
      hasFinger: !!(h && h.fingerSt),
      fingerSt: h && h.fingerSt ? h.fingerSt : '',
      choices: choices,
      voteLine: st.wrong ? '흔적을 떠올려 보세요' : '의심되는 사람을 누르세요',
      bubbleCls: st.wrong ? (st.wrongKey % 2 ? 'shake' : 'shake ') : '',
      revealed: st.revealed,
      sparks: sparks,
      roles: roles,
      inEpisode: s >= 1 && s <= 7,
      dots: dots,
      progressLabel: '7단계 중 ' + s + '단계',
      soundLabel: st.sound ? '소리 끄기' : '소리 켜기',
      soundWave: st.sound ? 'M16 9a4 4 0 010 6M18.5 6.5a7.5 7.5 0 010 11' : 'M16 9l5 6M21 9l-5 6',
      showNext: (s === 2 && st.line === 1) || (s === 4 && st.seen) || s === 5 || (s === 6 && st.revealed) || s === 7,
      endButtons: s === 0 || s === 8,
      start: () => { this.ctx(); this.go(1); },
      next: () => { this.sfx('tap'); this.go(s + 1); },
      skip: () => this.go(8),
      replay: () => { this.ctx(); this.go(1); },
      doErrand: () => { this.sfx('tap'); this.setState({ done: true }); this.later(() => this.go(4), 700); },
      toggleSound: () => this.setState({ sound: !st.sound })
    };
  }
}
