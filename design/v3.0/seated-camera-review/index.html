<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>미니피아 · 고정 좌석 카메라 시안</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="review">
    <header class="review-title">
      <h1>재즈 바 고정 좌석 시안</h1>
    </header>
    <details class="comparison-options" open>
      <summary>공간·캐릭터 비교</summary>
      <div class="variants">
        <nav aria-label="재즈 바 배경과 소품 비교">
          <a data-art="original" href="?art=original">초기 공간</a>
          <a data-art="polished" href="?art=polished">이전 공간</a>
          <a data-art="detailed" href="?art=detailed">정교화 공간</a>
        </nav>
        <nav aria-label="캐릭터 모델 비교">
          <a data-model="original" href="?model=original">기존 모델</a>
          <a data-model="detail" href="?model=detail">정교화 모델</a>
        </nav>
        <select class="preview-animal" aria-label="같은 자리에서 볼 캐릭터">
          <option value="">캐릭터 가까이 보기</option>
        </select>
      </div>
    </details>
    <nav class="views" aria-label="시점 선택"></nav>
    <div class="comparison"></div>
  </main>

  <template id="panel">
    <section class="view">
      <header class="view-title"><h2></h2><p></p></header>
      <div class="phone">
        <header class="phase"><strong>토론</strong><span class="time" aria-hidden="true"></span><span>8명</span></header>
        <div class="world" role="group"></div>
        <div class="quote" aria-live="polite">
          <img alt="" width="37" height="37">
          <div><strong></strong><p></p></div>
        </div>
        <div class="participants" role="group" aria-label="테이블의 참가자"></div>
        <div class="actions">
          <button class="suspect" type="button" aria-pressed="false">의심딱지</button>
          <span class="action-status" role="status"></span>
        </div>
        <div class="chat" aria-label="토론 채팅">
          <p><b>지호</b> 난 창가 쪽에 있었어.</p>
          <p><b>민준</b> 피아노 소리는 들었어?</p>
          <div class="chat-placeholder" aria-hidden="true">메시지 입력 <span>➤</span></div>
        </div>
      </div>
    </section>
  </template>
  <script type="module" src="./review.ts"></script>
</body>
</html>
