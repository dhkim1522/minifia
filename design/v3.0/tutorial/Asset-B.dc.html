<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&amp;family=Gowun+Dodum&amp;display=swap">
<style>
body{margin:0}

<div style="width: 820px; height: 780px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 14px; background: #14111c; color: #f1f2f5; font-family: 'Gowun Dodum', system-ui, sans-serif">
<span style="font-family: 'Gowun Batang', serif; font-size: 20px; font-weight: 700; color: #e8d3a8">재즈 바</span>
<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{bar}}" as="it" hint-placeholder-count="8">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<div role="img" aria-label="{{it.name}}" style="width: 72px; height: 72px; border-radius: 50%; background: {{it.bg}}; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.25), 0 0 0 3px #221d2e; display: grid; place-items: center">
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
</div>
<span style="font-size: 13px; color: #a9aebb">{{it.name}}</span>
</div>
</sc-for>
</div>
<span style="font-family: 'Gowun Batang', serif; font-size: 20px; font-weight: 700; color: #e8d3a8; margin-top: 6px">시계탑 광장</span>
<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{plaza}}" as="it" hint-placeholder-count="8">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<div role="img" aria-label="{{it.name}}" style="width: 72px; height: 72px; border-radius: 50%; background: {{it.bg}}; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.25), 0 0 0 3px #221d2e; display: grid; place-items: center">

</div>
<span style="font-size: 13px; color: #a9aebb">{{it.name}}</span>
</div>
</sc-for>
</div>
<span style="font-family: 'Gowun Batang', serif; font-size: 20px; font-weight: 700; color: #e8d3a8; margin-top: 6px">아침 흔적 조각</span>
<div style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{trace}}" as="it" hint-placeholder-count="9">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<div role="img" aria-label="{{it.name}}" style="width: 64px; height: 64px; border-radius: 50%; background: {{it.bg}}; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.25), 0 0 0 3px #221d2e; display: grid; place-items: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{it.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
</div>
<span style="font-size: 12px; color: #a9aebb">{{it.name}}</span>
</div>
</sc-for>
</div>
<span style="font-size: 13px; color: #a9aebb; margin-top: 4px">색 동전 + 흰 선 그림 · 모양이 통일되지만 사물 고유색이 사라져 장소끼리 구분은 A 보다 약하다</span>
</div>
